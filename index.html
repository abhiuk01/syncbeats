<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#07080c">
<title>SyncBeat — Listen Together</title>
<script src="https://cdn.socket.io/4.8.1/socket.io.min.js"></script>
<script src="https://www.youtube.com/iframe_api"></script>
<style>
:root{color-scheme:dark;--bg:#07080c;--panel:#10121a;--panel2:#0d0f16;--line:rgba(255,255,255,.09);--text:#f6f7fb;--muted:#8d91a2;--sub:#5f6372;--violet:#8b5cf6;--violet2:#a78bfa;--cyan:#22d3ee;--green:#34d399;--red:#fb7185;--amber:#fbbf24;--shadow:0 24px 70px rgba(0,0,0,.36)}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif;background:var(--bg);color:var(--text)}body{overflow-x:hidden}button,input,textarea{font:inherit}button{border:0;cursor:pointer;color:inherit}button:disabled{opacity:.36;cursor:not-allowed}.app{min-height:100vh;background:radial-gradient(circle at 10% 0,rgba(124,58,237,.22),transparent 32%),radial-gradient(circle at 92% 12%,rgba(6,182,212,.16),transparent 29%),radial-gradient(circle at 52% 100%,rgba(236,72,153,.08),transparent 35%),var(--bg)}
.wrap{width:min(1480px,calc(100% - 28px));margin:auto}.topbar{height:64px;display:flex;align-items:center;gap:14px;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:30;background:rgba(7,8,12,.84);backdrop-filter:blur(18px)}.brand{display:flex;align-items:center;gap:10px;font-weight:850;letter-spacing:-.03em}.logo{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;background:linear-gradient(135deg,#8b5cf6,#22d3ee);color:#050507;box-shadow:0 12px 30px rgba(124,58,237,.25)}.brand span{font-size:16px}.status{font-size:10px;color:var(--muted)}.status b{color:var(--green)}.spacer{flex:1}.top-actions{display:flex;gap:7px;align-items:center}.iconbtn,.softbtn,.dangerbtn{background:rgba(255,255,255,.035);border:1px solid var(--line);border-radius:11px;padding:9px 11px;font-size:11px;font-weight:700}.iconbtn{width:38px;padding:9px}.softbtn:hover,.iconbtn:hover{background:rgba(255,255,255,.065)}.dangerbtn{color:#fecdd3;border-color:rgba(251,113,133,.18);background:rgba(251,113,133,.04)}
.onboard{min-height:calc(100vh - 64px);display:grid;place-items:center;padding:48px 0}.onboard-card{width:min(980px,100%);display:grid;grid-template-columns:1.05fr .95fr;gap:28px;align-items:center}.hero h1{font-size:clamp(44px,6vw,78px);line-height:.98;letter-spacing:-.055em;margin:12px 0}.grad{background:linear-gradient(90deg,#c4b5fd,#a5f3fc);-webkit-background-clip:text;background-clip:text;color:transparent}.eyebrow{font-size:10px;text-transform:uppercase;letter-spacing:.22em;color:#b9abff;font-weight:800}.hero p{color:var(--muted);line-height:1.7;max-width:560px}.chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:18px}.chip{padding:8px 11px;border:1px solid var(--line);background:rgba(255,255,255,.03);border-radius:999px;font-size:10px;color:#aeb1bf}.card{background:rgba(16,18,26,.82);border:1px solid var(--line);box-shadow:var(--shadow);border-radius:24px;backdrop-filter:blur(18px)}.form-card{padding:28px}.step-title{font-size:30px;letter-spacing:-.04em;margin:2px 0 7px}.muted{color:var(--muted)}.small{font-size:11px;color:var(--sub);line-height:1.6}.field{margin-top:16px}.field label{display:block;font-size:10px;font-weight:800;color:#7f8393;text-transform:uppercase;letter-spacing:.14em;margin-bottom:8px}.input{width:100%;background:rgba(255,255,255,.035);border:1px solid var(--line);border-radius:13px;color:inherit;padding:13px 14px;outline:0}.input:focus{border-color:rgba(167,139,250,.55);box-shadow:0 0 0 4px rgba(139,92,246,.08)}.primary{width:100%;background:linear-gradient(135deg,#8b5cf6,#6d5dfc);padding:13px 15px;border-radius:13px;font-size:12px;font-weight:850;box-shadow:0 14px 30px rgba(124,58,237,.22)}.primary:hover{filter:brightness(1.04)}.back{margin-bottom:18px;background:none;color:#85899a;font-size:11px}.error{margin-top:12px;border:1px solid rgba(251,113,133,.18);background:rgba(251,113,133,.08);color:#fecdd3;padding:10px 12px;border-radius:12px;font-size:11px}.mode-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:22px}.mode{padding:20px;text-align:left;border-radius:20px;background:rgba(16,18,26,.82);border:1px solid var(--line);box-shadow:var(--shadow);transition:.18s}.mode:hover{transform:translateY(-2px);border-color:rgba(167,139,250,.28)}.mode.featured{background:linear-gradient(180deg,rgba(124,58,237,.16),rgba(16,18,26,.82));border-color:rgba(167,139,250,.25)}.mode-icon{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;background:rgba(255,255,255,.045);border:1px solid var(--line);font-weight:900}.mode h3{font-size:17px;margin:18px 0 5px}.mode p{font-size:11px;color:var(--muted);line-height:1.65;margin:0}.mode b{display:block;margin-top:16px;font-size:10px;color:#c5bbff}
.room{height:calc(100vh - 78px);min-height:700px;display:grid;grid-template-columns:220px minmax(0,1fr) 360px;gap:12px;padding:12px 0}.side,.main,.chatcol{min-height:0}.side{padding:12px;display:flex;flex-direction:column}.side .card{padding:12px}.roombox strong{display:block;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.roombox small{display:block;color:var(--sub);margin-top:5px;font-family:ui-monospace,monospace;font-size:10px}.statrow{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}.stat{padding:10px;border:1px solid var(--line);border-radius:12px;background:rgba(255,255,255,.022)}.stat small{display:block;color:var(--sub);font-size:8px;text-transform:uppercase;letter-spacing:.12em}.stat b{display:block;margin-top:4px;font-size:15px}.section-label{font-size:9px;letter-spacing:.18em;text-transform:uppercase;color:var(--sub);font-weight:800;margin:18px 5px 8px}.people-list{overflow:auto;min-height:0}.person{padding:9px;border-radius:11px;border:1px solid transparent}.person:hover{background:rgba(255,255,255,.025);border-color:var(--line)}.phead{display:flex;align-items:center;gap:9px}.avatar{width:32px;height:32px;border-radius:10px;display:grid;place-items:center;background:linear-gradient(135deg,rgba(139,92,246,.75),rgba(34,211,238,.65));font-size:11px;font-weight:900}.pinfo{min-width:0;flex:1}.pinfo strong{display:block;font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.pinfo small{display:flex;gap:5px;margin-top:4px;color:var(--sub);font-size:9px}.tag{padding:3px 6px;border-radius:6px;font-size:8px;border:1px solid var(--line);color:#9fa3b4}.tag.host{color:#fde68a;border-color:rgba(251,191,36,.2);background:rgba(251,191,36,.05)}.tag.dj{color:#a5f3fc;border-color:rgba(34,211,238,.2);background:rgba(34,211,238,.05)}.person-actions{display:flex;gap:5px;margin-top:8px}.mini{background:rgba(255,255,255,.03);border:1px solid var(--line);border-radius:8px;padding:6px 8px;font-size:9px}.mini.red{color:#fecdd3;border-color:rgba(251,113,133,.16)}.side-bottom{margin-top:auto;display:grid;gap:7px}.main{overflow:auto;padding-bottom:8px}.main-head{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:6px 0 12px}.main-head .np{min-width:0}.main-head .np small{font-size:9px;color:#8e92a3;letter-spacing:.18em;text-transform:uppercase}.main-head .np strong{display:block;font-size:20px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:3px}.listening{font-size:9px;color:#717585;display:flex;align-items:center;gap:6px;white-space:nowrap}.live-dot{width:7px;height:7px;border-radius:50%;background:var(--green);box-shadow:0 0 0 5px rgba(52,211,153,.09)}
.player-card{overflow:hidden}.yt-wrap{aspect-ratio:16/9;background:#030406;position:relative}.yt-wrap iframe{position:absolute;inset:0;width:100%;height:100%;border:0;pointer-events:none}.player-empty{position:absolute;inset:0;display:grid;place-items:center;background:radial-gradient(circle at 50% 40%,rgba(124,58,237,.22),transparent 45%),#06070b;text-align:center}.player-empty>div{max-width:430px;padding:28px}.player-empty .biglogo{width:54px;height:54px;border-radius:17px;background:rgba(255,255,255,.05);border:1px solid var(--line);display:grid;place-items:center;margin:auto;font-size:20px}.player-empty h3{font-size:18px;margin:13px 0 5px}.player-empty p{font-size:11px;color:var(--muted);line-height:1.65;margin:0}.player-error{position:absolute;inset:0;display:grid;place-items:center;padding:30px;background:rgba(5,6,9,.88);text-align:center}.player-error b{font-size:14px}.player-error p{color:var(--muted);font-size:11px;line-height:1.6}.controls{padding:15px 16px 18px}.control-top{display:flex;align-items:center;justify-content:space-between;gap:10px}.control-info small{display:block;color:var(--sub);font-size:9px;text-transform:uppercase;letter-spacing:.16em}.control-info b{display:block;font-size:11px;margin-top:3px}.control-row{display:flex;align-items:center;gap:7px}.round{width:37px;height:37px;border-radius:50%;background:rgba(255,255,255,.04);border:1px solid var(--line);display:grid;place-items:center;font-size:11px}.round.big{width:46px;height:46px;background:#fff;color:#08090d;border-color:#fff}.progress{display:grid;grid-template-columns:36px 1fr 36px;gap:8px;align-items:center;margin-top:14px;font-size:9px;color:var(--sub)}input[type=range]{accent-color:#a78bfa}.volume-line{display:flex;align-items:center;gap:8px;margin-top:11px;font-size:9px;color:var(--sub)}.volume-line input{width:120px}.sync-state{margin-left:auto;color:var(--green)}
.lower{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:12px;margin-top:12px}.section-card{padding:14px}.section-card h3{margin:3px 0 0;font-size:15px}.section-card .desc{font-size:10px;color:var(--sub);margin-top:3px}.headrow{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}.badge{border:1px solid var(--line);padding:6px 9px;border-radius:999px;font-size:9px;color:#9da1b0;background:rgba(255,255,255,.02)}.addrow{display:flex;gap:7px;margin-top:13px}.addrow .primary{width:auto;min-width:78px}.queue{display:grid;gap:5px;margin-top:10px;max-height:280px;overflow:auto}.qitem{display:flex;align-items:center;gap:8px;padding:8px;border-radius:10px;border:1px solid transparent}.qitem:hover{background:rgba(255,255,255,.03);border-color:var(--line)}.drag{width:15px;color:#454a59}.thumb{width:58px;height:38px;border-radius:7px;object-fit:cover;background:#0a0b10}.qinfo{min-width:0;flex:1}.qinfo strong{display:block;font-size:10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.qinfo small{display:block;font-size:8px;color:var(--sub);margin-top:4px}.qactions{display:flex;gap:5px}.emptyq{text-align:center;padding:28px 10px;color:var(--sub);font-size:10px;border:1px dashed rgba(255,255,255,.08);border-radius:11px}.voicecard .voice-state{display:flex;align-items:center;justify-content:space-between}.voice-dot{width:10px;height:10px;border-radius:50%;background:#343846}.voice-dot.on{background:var(--green);box-shadow:0 0 0 7px rgba(52,211,153,.08)}.voice-actions{display:grid;grid-template-columns:1fr 42px 42px;gap:7px;margin-top:14px}.voice-actions button{border-radius:11px;border:1px solid var(--line);background:rgba(255,255,255,.03);padding:10px;font-size:9px;font-weight:800}.voice-actions .join{background:var(--violet);border-color:transparent}.voice-sub{font-size:9px;color:var(--sub);line-height:1.55;margin-top:9px}.voice-settings{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:8px}.voice-settings button,.voice-settings label{border:1px solid var(--line);border-radius:9px;padding:8px;font-size:9px;color:#8f94a3;background:rgba(255,255,255,.02)}.voice-settings label{display:flex;align-items:center;gap:6px}.peer-volumes{display:grid;gap:6px;margin-top:10px}.peer-volume{display:flex;align-items:center;gap:6px;border:1px solid rgba(255,255,255,.06);padding:7px;border-radius:9px}.peer-volume span{min-width:0;flex:1;font-size:8px;color:#8f94a3;overflow:hidden;text-overflow:ellipsis}.peer-volume input{width:75px}.chatcol{background:rgba(8,9,13,.70);border:1px solid var(--line);border-radius:18px;display:flex;flex-direction:column;overflow:hidden}.chathead{padding:14px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}.chathead b{display:block;font-size:10px;text-transform:uppercase;letter-spacing:.18em;color:#c3b7ff}.chathead small{display:block;color:var(--sub);font-size:9px;margin-top:5px}.messages{flex:1;overflow:auto;padding:13px}.msg{display:flex;gap:8px;margin-bottom:12px}.msg.system{justify-content:center}.mavatar{width:27px;height:27px;border-radius:8px;background:linear-gradient(135deg,#8b5cf6,#06b6d4);display:grid;place-items:center;font-size:8px;font-weight:900;flex:0 0 auto}.bubblewrap{min-width:0;max-width:85%}.meta{display:flex;align-items:center;gap:5px}.meta strong{font-size:9px}.meta time{font-size:7px;color:#5f6372}.bubble{margin-top:3px;padding:8px 10px;border-radius:11px;background:rgba(255,255,255,.028);border:1px solid rgba(255,255,255,.05);font-size:10px;line-height:1.55;color:#c7c9d2;overflow-wrap:anywhere}.system .bubble{background:none;border:0;color:#696d7a;text-align:center}.reactions{display:flex;align-items:center;gap:4px;margin-top:4px}.reaction{border:1px solid var(--line);background:rgba(255,255,255,.02);border-radius:999px;padding:4px 6px;font-size:8px;color:#8c90a1}.reactbtn{border:1px solid var(--line);background:rgba(255,255,255,.02);border-radius:999px;padding:4px 7px;font-size:8px;color:#7c8190}.typing{font-size:8px;color:#5f6372;padding:0 13px 5px}.composer{border-top:1px solid var(--line);padding:10px;display:flex;gap:7px}.composer textarea{flex:1;min-height:42px;max-height:110px;resize:none;border:1px solid var(--line);background:rgba(255,255,255,.03);border-radius:11px;color:inherit;padding:10px;outline:none;font-size:10px}.composer button{width:40px;border-radius:10px;background:var(--violet);font-size:12px;font-weight:900}.toast{position:fixed;z-index:100;left:50%;bottom:20px;transform:translateX(-50%);background:#151722;border:1px solid var(--line);box-shadow:var(--shadow);padding:10px 13px;border-radius:999px;font-size:10px;font-weight:800;max-width:min(80vw,600px);text-align:center}
.hidden{display:none!important}.mobile-only{display:none}.settings-pop{position:fixed;right:20px;top:72px;width:min(420px,calc(100% - 40px));z-index:40}.settings-pop .card{padding:15px}.settings-pop p{margin:0;font-size:10px;color:var(--muted);line-height:1.6}.settings-title{font-size:10px;text-transform:uppercase;letter-spacing:.16em;color:#c4b5fd;font-weight:900;margin-bottom:7px}
@media(max-width:1120px){.room{grid-template-columns:190px minmax(0,1fr);height:auto}.chatcol{display:none}.lower{grid-template-columns:minmax(0,1fr) 290px}.mobile-only{display:block}.mode-grid{grid-template-columns:1fr}.onboard-card{grid-template-columns:1fr}.hero{text-align:center}.hero p{margin-left:auto;margin-right:auto}.chips{justify-content:center}}
@media(max-width:760px){.wrap{width:min(100% - 18px,1480px)}.room{grid-template-columns:1fr;padding-top:8px;min-height:auto}.side{order:2;min-height:auto}.main{order:1}.side .people-list{max-height:240px}.lower{grid-template-columns:1fr}.topbar{height:58px}.top-actions .softbtn{display:none}.main-head .np strong{font-size:17px}.onboard{padding:25px 0}.form-card{padding:20px}.mode{padding:17px}.yt-wrap{border-radius:13px}.control-top{align-items:flex-start}.control-row{flex-wrap:wrap;justify-content:flex-end}}
html.light{filter:none}
</style>
</head>
<body>
<div id="app" class="app"></div>
<script>
(() => {
  'use strict';
  const SERVER = 'https://syncbeat-live.onrender.com';
  const socket = io(SERVER,{autoConnect:false,transports:['websocket','polling']});
  let view='name', name=localStorage.getItem('syncbeat:name')||'', room=null, chat=[], currentTab='chat';
  let yt=null, ytReady=false, ytVideo='', playerTimer=null;
  let localStream=null, voiceJoined=false, voiceMuted=false, deaf=false, ptt=false, speaking=false;
  const peers=new Map(), peerAudio=new Map(), peerVolumes=new Map();
  let typingTimer=null, toastTimer=null, settingsOpen=false;

  const esc=s=>String(s??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
  const fmt=n=>{n=Math.max(0,Math.floor(Number(n)||0));return Math.floor(n/60)+':'+String(n%60).padStart(2,'0')};
  const initials=s=>(String(s||'?').trim()[0]||'?').toUpperCase();
  const $=id=>document.getElementById(id);
  function toast(t){const d=$('toast');if(!d)return;d.textContent=t;d.classList.remove('hidden');clearTimeout(toastTimer);toastTimer=setTimeout(()=>d.classList.add('hidden'),1800)}
  function render(){
    const root=$('app');
    root.innerHTML=topbar()+ (room ? roomView() : onboardView()) + '<div id="toast" class="toast hidden"></div>' + (settingsOpen&&!room?'':settingsOpen?settingsPanel():'');
    bindDynamic();
  }
  function topbar(){
    return `<header class="topbar"><div class="wrap" style="display:flex;align-items:center;gap:14px;width:100%">
      <button class="brand" onclick="goHome()"><span class="logo">♪</span><span>SyncBeat</span></button>
      <div class="spacer"></div>
      ${room?`<span class="status"><b id="conn">${socket.connected?'Connected':'Connecting…'}</b></span>`:''}
      <div class="top-actions">
       ${room?`<button class="softbtn" onclick="copyInvite()">Share room</button><button class="iconbtn" onclick="toggleSettings()" title="Room settings">⚙</button><button class="iconbtn" onclick="toggleTheme()" title="Theme">☼</button><button class="dangerbtn" onclick="leaveRoom()">Leave</button>`:`<button class="iconbtn" onclick="toggleTheme()" title="Theme">☼</button>`}
      </div></div></header>`;
  }
  function onboardView(){
    const hasInvite=new URLSearchParams(location.search).get('room');
    if(view==='name') return `<main class="onboard"><div class="wrap"><div class="onboard-card"><section class="hero"><div class="eyebrow">WELCOME TO SYNCBEAT</div><h1>Music feels better<br><span class="grad">when you're together.</span></h1><p>Listen to official YouTube embeds with friends in a private room — synchronized playback, shared queue, live chat and browser voice.</p><div class="chips"><span class="chip">Official YouTube embeds</span><span class="chip">Real-time sync</span><span class="chip">WebRTC voice</span></div></section><section class="card form-card"><div class="eyebrow">STEP 1 OF 2</div><h2 class="step-title">What should we call you?</h2><p class="small">Enter your name once. You can change it later by starting a new session.</p><div class="field"><label>Your name</label><input id="nameInput" class="input" maxlength="32" value="${esc(name)}" placeholder="e.g. Abhi" autofocus></div><button class="primary" onclick="saveName()">Enter SyncBeat →</button>${hasInvite?'<p class="small" style="margin-top:12px;color:#b9abff">You have a room invite ready for the next step.</p>':''}</section></div></div></main>`;
    if(view==='mode') return `<main class="onboard"><div class="wrap"><div style="text-align:center"><div class="eyebrow">LISTENING MODE</div><h1 style="font-size:clamp(38px,5vw,64px);letter-spacing:-.05em;margin:8px 0">Hey, ${esc(name)}.</h1><p class="small">Choose exactly how you want to listen.</p></div><div class="mode-grid"><button class="mode" onclick="openSolo()"><div class="mode-icon">◉</div><h3>Listen solo</h3><p>Play a YouTube video privately on your device. No room needed.</p><b>Listen solo →</b></button><button class="mode featured" onclick="openCreate()"><div class="mode-icon">◎</div><h3>Create a Room</h3><p>Start a private room, become host, sync playback, chat and use voice.</p><b>Create room →</b></button><button class="mode" onclick="openJoin()"><div class="mode-icon">↳</div><h3>Join a Room</h3><p>Enter your friend's 6-character code and jump into their room.</p><b>Join room →</b></button></div></div></main>`;
    if(view==='create') return `<main class="onboard"><div class="wrap"><div class="card form-card" style="width:min(560px,100%);margin:auto"><button class="back" onclick="backMode()">← Listening modes</button><div class="eyebrow">CREATE ROOM</div><h2 class="step-title">Create a private room</h2><p class="small">You become the host. Only you can control playback until you give DJ power to someone else.</p><div class="field"><label>Room name</label><input id="roomName" class="input" maxlength="60" value="Friday Night Mix"></div><div class="field"><label>Password (optional)</label><input id="roomPassword" type="password" class="input" maxlength="100" placeholder="Leave blank for no password"></div><button class="primary" onclick="createRoom()">Create room →</button>${errorBox()}</div></div></main>`;
    const code=(new URLSearchParams(location.search).get('room')||'').toUpperCase();
    if(view==='join') return `<main class="onboard"><div class="wrap"><div class="card form-card" style="width:min(560px,100%);margin:auto"><button class="back" onclick="backMode()">← Listening modes</button><div class="eyebrow">JOIN ROOM</div><h2 class="step-title">Join a friend's room</h2><p class="small">Enter the 6-character room code. If the room is password-protected, you'll be asked for it here.</p><div class="field"><label>Room code</label><input id="joinCode" class="input" maxlength="6" value="${esc(code)}" placeholder="ABC123" style="text-transform:uppercase;letter-spacing:.28em;font-family:ui-monospace,monospace"></div><div class="field"><label>Password (if required)</label><input id="joinPassword" type="password" class="input" maxlength="100"></div><button class="primary" onclick="joinRoom()">Join room →</button>${errorBox()}</div></div></main>`;
    if(view==='solo') return soloView();
  }
  let errorMsg='';
  function errorBox(){return errorMsg?`<div class="error">${esc(errorMsg)}</div>`:''}
  function saveName(){const v=$('nameInput')?.value.trim();if(!v){errorMsg='Please enter your name.';render();return}name=v.slice(0,32);localStorage.setItem('syncbeat:name',name);errorMsg='';view='mode';render();}
  function backMode(){errorMsg='';view='mode';render()}
  function openCreate(){errorMsg='';view='create';render()}
  function openJoin(){errorMsg='';view='join';render()}
  function openSolo(){view='solo';render()}
  function goHome(){if(room)return;view='name';render()}
  function soloView(){return `<main class="onboard"><div class="wrap"><div class="card" style="padding:18px;width:min(980px,100%);margin:auto"><button class="back" onclick="backMode()">← Listening modes</button><div class="eyebrow">SOLO LISTENING</div><h2 class="step-title">Listen solo</h2><p class="small">Paste a YouTube link or video ID. Playback stays on your device.</p><div class="addrow"><input id="soloUrl" class="input" placeholder="https://youtube.com/watch?v=..."><button class="primary" style="width:auto" onclick="loadSolo()">Load</button></div><div class="player-card card" style="margin-top:12px"><div class="yt-wrap"><div id="soloPlayer"></div><div id="soloEmpty" class="player-empty"><div><div class="biglogo">♪</div><h3>Your video will appear here</h3><p>Use an official YouTube URL. Videos with embedding disabled or restricted by YouTube may not play.</p></div></div><div id="soloError" class="player-error hidden"></div></div></div></div></div></main>`}
  function getYTId(input){try{let s=String(input||'').trim();if(/^[A-Za-z0-9_-]{11}$/.test(s))return s;const u=new URL(s);const h=u.hostname.replace(/^www\./,'');if(h==='youtu.be')return u.pathname.split('/').filter(Boolean)[0]||null;if(['youtube.com','m.youtube.com','music.youtube.com'].includes(h)){if(u.pathname==='/watch')return u.searchParams.get('v');const p=u.pathname.split('/').filter(Boolean);if(['shorts','embed','live'].includes(p[0]))return p[1]||null}return null}catch{return null}}
  function createRoom(){errorMsg='';if(!socket.connected)socket.connect();const rn=$('roomName')?.value.trim();const pw=$('roomPassword')?.value||undefined;if(!rn)return errorMsg='Enter a room name.',render();socket.emit('room:create',{name:rn,userName:name,password:pw},res=>{if(res?.error){errorMsg=res.error;render();return}room=res.state;chat=[];errorMsg='';history.replaceState({},'',location.pathname+'?room='+room.code);view='room';render();});}
  function joinRoom(){errorMsg='';if(!socket.connected)socket.connect();const code=$('joinCode')?.value.trim().toUpperCase();const pw=$('joinPassword')?.value||undefined;if(code.length!==6)return errorMsg='Enter the 6-character room code.',render();socket.emit('room:join',{code,userName:name,password:pw},res=>{if(res?.error){errorMsg=res.error;render();return}room=res.state;chat=res.chat||[];errorMsg='';history.replaceState({},'',location.pathname+'?room='+room.code);view='room';render();});}
  function roomView(){const me=room?.participants?.find(p=>p.id===socket.id)||{};const host=room.hostId===socket.id, control=host||!!me.canControl;return `<main class="wrap room"><aside class="side"><div class="card"><div class="roombox"><strong>${esc(room.name)}</strong><small>#${esc(room.code)}</small></div><div class="statrow"><div class="stat"><small>Online</small><b>${room.participants.length}</b></div><div class="stat"><small>Queue</small><b>${room.queue.length}</b></div></div></div><div class="section-label">People</div><div class="people-list">${room.participants.map(personRow).join('')}</div><div class="side-bottom"><button class="softbtn" onclick="copyInvite()">Copy invite link</button><button class="dangerbtn" onclick="leaveRoom()">Leave room</button></div></aside><section class="main"><div class="main-head"><div class="np"><small>Listening together</small><strong>${esc(room.current?.title||'Nothing is playing')}</strong></div><div class="listening"><span class="live-dot"></span>${room.participants.length} in room</div></div>${playerCard(control)}<div class="lower"><section class="card section-card"><div class="headrow"><div><div class="eyebrow">UP NEXT</div><h3>Shared queue</h3><div class="desc">Anyone can add. Host and approved DJs can choose what plays.</div></div><span class="badge">${room.queue.length}</span></div><div class="addrow"><input id="queueUrl" class="input" placeholder="Paste YouTube URL or video ID"><button class="primary" onclick="addSong()">Add</button></div><div class="queue">${room.queue.length?room.queue.map((s,i)=>queueRow(s,i,control)).join(''):'<div class="emptyq">No songs queued yet.<br>Paste a YouTube link above to add one.</div>'}</div></section>${voiceCard()}</div></section><aside class="chatcol"><div class="chathead"><div><b>Room chat</b><small id="chatMode">Live messages</small></div><button class="iconbtn" onclick="scrollChatBottom()">↓</button></div><div id="messages" class="messages">${chat.map(renderMsg).join('')}</div><div id="typing" class="typing"></div><div class="composer"><textarea id="chatInput" placeholder="Message the room…" oninput="typing(this.value)" onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();sendChat()}"></textarea><button onclick="sendChat()" aria-label="Send">→</button></div></aside></main>`}
  function personRow(p){const me=p.id===socket.id, host=room.hostId===socket.id;return `<div class="person"><div class="phead"><div class="avatar">${initials(p.name)}</div><div class="pinfo"><strong>${esc(p.name)}${me?' (you)':''}</strong><small>${p.isHost?'<span class="tag host">HOST</span>':''}${p.canControl&&!p.isHost?'<span class="tag dj">DJ</span>':''}${p.voiceJoined?'<span>voice</span>':''}${p.muted?'<span style="color:#fb7185">muted</span>':''}</small></div></div>${host&&!me?`<div class="person-actions"><button class="mini" onclick="toggleDJ('${p.id}')">${p.canControl?'Remove DJ':'Give DJ power'}</button><button class="mini" onclick="transferHost('${p.id}')">Make host</button><button class="mini red" onclick="kickUser('${p.id}')">Remove</button></div>`:''}</div>`}
  function queueRow(s,i,control){return `<div class="qitem" draggable="${control}" ondragstart="startDrag(event,${i})" ondragover="event.preventDefault()" ondrop="dropDrag(event,${i})"><div class="drag">${control?'⋮⋮':String(i+1)}</div><img class="thumb" src="${esc(s.thumbnail)}" alt=""><div class="qinfo"><strong>${esc(s.title)}</strong><small>Added by ${esc(s.addedBy)}</small></div>${control?`<div class="qactions"><button class="mini" title="Play this" onclick="playQueue(${i})">▶</button><button class="mini red" title="Remove" onclick="removeQueue(${i})">×</button></div>`:''}</div>`}
  function playerCard(control){return `<div class="card player-card"><div class="yt-wrap"><div id="roomPlayer"></div>${!room.current?`<div class="player-empty"><div><div class="biglogo">♪</div><h3>No song playing</h3><p>Add a YouTube link to the shared queue. The host or a DJ can start playback for everyone.</p></div></div>`:''}<div id="playerError" class="player-error hidden"></div></div><div class="controls"><div class="control-top"><div class="control-info"><small>${control?'DJ CONTROL':'LISTEN ONLY'}</small><b>${control?'You can control shared playback':'Playback is locked to the host / DJ'}</b></div><div class="control-row"><button class="round" ${control?'':'disabled'} onclick="seekRelative(-10)">−10</button><button class="round big" ${control?'':'disabled'} onclick="togglePlay()">${room.isPlaying?'❚❚':'▶'}</button><button class="round" ${control?'':'disabled'} onclick="seekRelative(10)">+10</button><button class="round" ${control&&room.queue.length?'':'disabled'} onclick="nextSong()">›</button></div></div><div class="progress"><span id="curTime">${fmt(room.position)}</span><input id="seekRange" ${control?'':'disabled'} type="range" min="0" max="1" step="0.1" value="${Math.min(room.position,1)}" oninput="scrub(Number(this.value))"><span id="durTime">0:00</span></div><div class="volume-line"><span>Volume</span><input type="range" min="0" max="100" value="70" oninput="setVolume(Number(this.value))"><span class="sync-state">${room.isPlaying?'Playing in sync':'Paused for everyone'}</span></div></div></div>`}
  function voiceCard(){return `<section class="card section-card voicecard"><div class="headrow"><div><div class="eyebrow">LIVE VOICE</div><h3>Talk together</h3><div class="desc">Peer-to-peer browser voice</div></div><div class="voice-dot ${voiceJoined?'on':''}"></div></div><div class="voice-actions"><button class="join" onclick="${voiceJoined?'leaveVoice()':'joinVoice()'}">${voiceJoined?'Leave voice':'Join voice'}</button><button onclick="toggleMute()" ${voiceJoined?'':'disabled'}>${voiceMuted?'Unmute':'Mute'}</button><button onclick="toggleDeaf()" ${voiceJoined?'':'disabled'}>${deaf?'Undeafen':'Deafen'}</button></div><div class="voice-settings"><button onclick="togglePTT()" ${voiceJoined?'':'disabled'}>${ptt?'Push-to-talk: V':'Normal microphone'}</button><label><input type="checkbox" onchange="setLow(this.checked)">Low bandwidth</label></div><div id="voicePeers" class="peer-volumes"></div><div class="voice-sub" id="voiceSub">${voiceJoined?'Voice connected.': 'Allow microphone access when prompted. TURN is recommended for restrictive networks in production.'}</div></section>`}
  function settingsPanel(){return `<div class="settings-pop"><div class="card"><div class="settings-title">Room settings</div><p>Host owns the shared playback. Giving DJ power grants a participant the same play, pause, seek, next and queue moderation controls, while other users remain listen-only.</p><div style="display:flex;gap:7px;margin-top:11px"><button class="softbtn" onclick="copyInvite()">Copy invite</button><button class="softbtn" onclick="toggleSettings()">Done</button></div></div></div>`}
  function bindDynamic(){
    if(room){setTimeout(()=>{bindPlayer();renderVoicePeers();const m=$('messages');if(m)m.scrollTop=m.scrollHeight;},0)}
    const ni=$('nameInput');if(ni)ni.addEventListener('keydown',e=>{if(e.key==='Enter')saveName()});
    const ji=$('joinCode');if(ji)ji.addEventListener('input',()=>ji.value=ji.value.replace(/[^a-z0-9]/ig,'').toUpperCase());
  }
  window.saveName=saveName;window.openCreate=openCreate;window.openJoin=openJoin;window.openSolo=openSolo;window.backMode=backMode;window.createRoom=createRoom;window.joinRoom=joinRoom;
  window.loadSolo=()=>{const id=getYTId($('soloUrl')?.value);if(!id)return alert('Paste a valid YouTube URL or 11-character video ID.');if(!window.YT?.Player)return alert('YouTube player is still loading. Try again.');$('soloEmpty')?.classList.add('hidden');yt=new YT.Player('soloPlayer',{videoId:id,playerVars:{playsinline:1,controls:1,rel:0,modestbranding:1},events:{onError:()=>{const e=$('soloError');e.innerHTML='<b>This video cannot be played here.</b><p>Embedding may be disabled, or the video may be private, restricted or unavailable. Choose another YouTube video.</p>';e.classList.remove('hidden')}}})};
  function bindPlayer(){
    if(!room?.current){ytVideo='';return}
    if(!window.YT?.Player)return;
    if(ytVideo!==room.current.id || !yt){
      ytVideo=room.current.id;ytReady=false;
      if(yt?.destroy)try{yt.destroy()}catch{}
      yt=new YT.Player('roomPlayer',{videoId:room.current.id,playerVars:{playsinline:1,controls:0,rel:0,modestbranding:1,disablekb:1},events:{onReady:e=>{ytReady=true;e.target.setVolume(70);e.target.seekTo(room.position,true);if(room.isPlaying)e.target.playVideo().catch?.(()=>{});startPlayerTimer()},onStateChange:e=>{if(e.data===0){const control=hasControl();if(control)socket.emit('player:action',{type:'ended'})}if(e.data===-1){const el=$('playerError');if(el){el.innerHTML='<div><b>Video unavailable</b><p>YouTube could not play this video in this embed. The owner may have disabled embedding, or the video may be restricted/private. Please choose another video.</p></div>';el.classList.remove('hidden')}}},onError:e=>{const el=$('playerError');if(el){el.innerHTML='<div><b>Video could not be played</b><p>YouTube returned an embed error. Choose another video.</p></div>';el.classList.remove('hidden')}}}});
    }
    startPlayerTimer();
  }
  function startPlayerTimer(){clearInterval(playerTimer);playerTimer=setInterval(()=>{if(!room)return;let p=room.position;if(yt?.getCurrentTime) {p=yt.getCurrentTime();$('curTime')&&( $('curTime').textContent=fmt(p));const d=yt.getDuration?.()||0;$('durTime')&&($('durTime').textContent=fmt(d));$('seekRange')&&($('seekRange').max=d||1,$('seekRange').value=Math.min(p,d||1));}},500)}
  function hasControl(){const me=room?.participants?.find(p=>p.id===socket.id);return !!room&&(room.hostId===socket.id||!!me?.canControl)}
  window.togglePlay=()=>{if(!hasControl())return;socket.emit('player:action',{type:room.isPlaying?'pause':'play',position:yt?.getCurrentTime?.()||room.position})};
  window.seekRelative=n=>{if(!hasControl())return;const v=Math.max(0,(yt?.getCurrentTime?.()||room.position)+n);yt?.seekTo?.(v,true);socket.emit('player:action',{type:'seek',position:v})};
  window.scrub=v=>{if(!hasControl())return;yt?.seekTo?.(v,true);socket.emit('player:action',{type:'seek',position:v})};
  window.setVolume=v=>{yt?.setVolume?.(v)};
  window.nextSong=()=>{if(!hasControl())return;socket.emit('player:action',{type:'next'})};
  window.addSong=()=>{const raw=$('queueUrl')?.value.trim();const id=getYTId(raw);if(!id)return toast('Paste a valid YouTube URL or video ID');socket.emit('queue:add',{id,title:'YouTube video '+id,thumbnail:'https://i.ytimg.com/vi/'+id+'/hqdefault.jpg',addedBy:name});$('queueUrl').value='';toast('Added to shared queue')};
  window.playQueue=i=>{if(!hasControl()||!room.queue[i])return;socket.emit('player:action',{type:'load',song:room.queue[i],index:i,removeFromQueue:true})};
  window.removeQueue=i=>{if(!hasControl())return;socket.emit('queue:remove',i)};
  let dragFrom=-1;window.startDrag=(e,i)=>{dragFrom=i;e.dataTransfer.setData('text/plain',String(i))};window.dropDrag=(e,to)=>{if(!hasControl())return;const from=Number(e.dataTransfer.getData('text/plain'));if(Number.isInteger(from)&&from!==to)socket.emit('queue:reorder',{from,to})};
  window.sendChat=()=>{const t=$('chatInput')?.value.trim();if(!t)return;socket.emit('chat:send',t);$('chatInput').value='';socket.emit('chat:typing',false)};
  window.typing=v=>{socket.emit('chat:typing',!!v);clearTimeout(typingTimer);typingTimer=setTimeout(()=>socket.emit('chat:typing',false),900)};
  window.scrollChatBottom=()=>{const m=$('messages');if(m)m.scrollTop=m.scrollHeight};
  function renderMsg(m){const time=new Date(m.ts).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});if(m.userId==='system')return `<div class="msg system"><div class="bubble">${esc(m.text)}</div></div>`;const reactions=Object.entries(m.reactions||{}).filter(([,v])=>v?.length).map(([k,v])=>`<button class="reaction" onclick="reactMsg('${m.id}','${k}')">${reactionSymbol(k)} ${v.length}</button>`).join('');return `<div class="msg"><div class="mavatar">${initials(m.name)}</div><div class="bubblewrap"><div class="meta"><strong>${esc(m.name)}</strong><time>${time}</time></div><div class="bubble">${esc(m.text)}</div><div class="reactions">${reactions}<button class="reactbtn" onclick="reactMsg('${m.id}','heart')">React</button></div></div></div>`}
  function reactionSymbol(k){return k==='heart'?'♥':k==='like'?'✓':k==='spark'?'✦':k==='clap'?'+' : k==='fire'?'*':'•'}
  window.reactMsg=(id,key)=>socket.emit('chat:react',{id,emoji:key});
  window.copyInvite=async()=>{const u=location.origin+location.pathname+'?room='+room.code;try{await navigator.clipboard.writeText(u);toast('Invite link copied')}catch{toast(u)}};
  window.leaveRoom=()=>{stopVoiceLocal();socket.disconnect();room=null;chat=[];settingsOpen=false;view='mode';history.replaceState({},'',location.pathname);render()};
  window.toggleDJ=id=>socket.emit('participant:set-control',id);window.transferHost=id=>socket.emit('host:transfer',id);window.kickUser=id=>socket.emit('participant:kick',id);
  window.toggleSettings=()=>{settingsOpen=!settingsOpen;render()};window.toggleTheme=()=>document.documentElement.classList.toggle('light');window.setLow=v=>{};
  function renderVoicePeers(){const box=$('voicePeers');if(!box)return;const ids=[...peers.keys()];box.innerHTML=ids.length?ids.map(id=>`<div class="peer-volume"><span>User ${esc(id.slice(0,6))}</span><input type="range" min="0" max="100" value="${peerVolumes.get(id)??100}" oninput="setPeerVolume('${id}',Number(this.value))"></div>`).join(''):''}
  window.setPeerVolume=(id,v)=>{peerVolumes.set(id,v);const a=peerAudio.get(id);if(a)a.volume=v/100};
  window.joinVoice=async()=>{if(voiceJoined)return;try{if(!navigator.mediaDevices?.getUserMedia)throw new Error('unsupported');localStream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true,autoGainControl:true}});voiceJoined=true;voiceMuted=false;socket.emit('voice:join');toast('Voice joined');render()}catch(e){toast(e?.name==='NotAllowedError'?'Microphone permission was denied.':'Could not access your microphone. Check browser permissions.')}};
  window.leaveVoice=()=>stopVoiceLocal();
  function stopVoiceLocal(){if(localStream)localStream.getTracks().forEach(t=>t.stop());localStream=null;for(const pc of peers.values())pc.close();peers.clear();for(const a of peerAudio.values())a.remove();peerAudio.clear();voiceJoined=false;voiceMuted=false;speaking=false;if(socket.connected)socket.emit('voice:leave')}
  window.toggleMute=()=>{if(!localStream)return;voiceMuted=!voiceMuted;localStream.getAudioTracks().forEach(t=>t.enabled=ptt?(!voiceMuted&&speaking):!voiceMuted);socket.emit('voice:mute',voiceMuted);toast(voiceMuted?'Microphone muted':'Microphone unmuted');render()};
  window.toggleDeaf=()=>{deaf=!deaf;for(const a of peerAudio.values())a.muted=deaf;render()};
  window.togglePTT=()=>{ptt=!ptt;if(localStream)localStream.getAudioTracks().forEach(t=>t.enabled=ptt?(!voiceMuted&&speaking):!voiceMuted);render()};
  window.goHome=goHome;
  function makePeer(peerId){if(peers.has(peerId))return peers.get(peerId);const pc=new RTCPeerConnection({iceServers:[{urls:'stun:stun.l.google.com:19302'},{urls:'stun:stun1.l.google.com:19302'}]});localStream?.getTracks().forEach(t=>pc.addTrack(t,localStream));pc.onicecandidate=e=>{if(e.candidate)socket.emit('voice:signal',{peerId,data:{candidate:e.candidate}})};pc.onconnectionstatechange=()=>{if(['failed','closed','disconnected'].includes(pc.connectionState)){pc.close();peers.delete(peerId);peerAudio.get(peerId)?.remove();peerAudio.delete(peerId);renderVoicePeers()}};pc.ontrack=e=>{let a=peerAudio.get(peerId);if(!a){a=new Audio();a.autoplay=true;peerAudio.set(peerId,a)}a.srcObject=e.streams[0];a.muted=deaf;a.volume=(peerVolumes.get(peerId)??100)/100;a.play().catch(()=>{});renderVoicePeers()};peers.set(peerId,pc);return pc}
  socket.on('connect',()=>{const el=$('conn');if(el){el.textContent='Connected';el.style.color='var(--green)'}});
  socket.on('disconnect',()=>{const el=$('conn');if(el){el.textContent='Reconnecting…';el.style.color='var(--amber)'}});
  socket.on('room:state',r=>{room=r;if(view!=='room')view='room';render()});
  socket.on('chat:message',m=>{chat.push(m);chat=chat.slice(-200);if(room){render();setTimeout(scrollChatBottom,10)}});
  socket.on('chat:reaction',x=>{const m=chat.find(m=>m.id===x.id);if(m){m.reactions=x.reactions;render()}});
  socket.on('chat:typing',x=>{const el=$('typing');if(el)el.textContent=x.typing?(x.name+' is typing…'):''});
  socket.on('room:kicked',()=>{toast('You were removed from the room.');setTimeout(()=>leaveRoom(),400)});
  socket.on('voice:peer-left',({peerId})=>{peers.get(peerId)?.close();peers.delete(peerId);peerAudio.get(peerId)?.remove();peerAudio.delete(peerId);renderVoicePeers()});
  socket.on('voice:peer-joined',async({peerId})=>{if(!localStream)return;const pc=makePeer(peerId);try{const offer=await pc.createOffer();await pc.setLocalDescription(offer);socket.emit('voice:signal',{peerId,data:pc.localDescription})}catch{}});
  socket.on('voice:peers',async({peerIds})=>{if(!localStream)return;for(const id of Array.isArray(peerIds)?peerIds:[]){const pc=makePeer(id);try{const offer=await pc.createOffer();await pc.setLocalDescription(offer);socket.emit('voice:signal',{peerId:id,data:pc.localDescription})}catch{}}});
  socket.on('voice:signal',async({peerId,data})=>{if(!localStream)return;const pc=makePeer(peerId);try{if(data?.type==='offer'){await pc.setRemoteDescription(data);const ans=await pc.createAnswer();await pc.setLocalDescription(ans);socket.emit('voice:signal',{peerId,data:pc.localDescription})}else if(data?.type==='answer'){await pc.setRemoteDescription(data)}else if(data?.candidate){await pc.addIceCandidate(data.candidate)}}catch{}});
  window.addEventListener('keydown',e=>{if(e.target instanceof HTMLInputElement||e.target instanceof HTMLTextAreaElement)return;if(!room)return;if(e.code==='Space'&&hasControl()){e.preventDefault();togglePlay()}if(e.key.toLowerCase()==='c')$('chatInput')?.focus();if(e.key.toLowerCase()==='m'&&voiceJoined)toggleMute();if(ptt&&voiceJoined&&!voiceMuted&&e.key.toLowerCase()==='v'){speaking=true;localStream?.getAudioTracks().forEach(t=>t.enabled=true)}});
  window.addEventListener('keyup',e=>{if(e.key.toLowerCase()==='v'&&ptt){speaking=false;localStream?.getAudioTracks().forEach(t=>t.enabled=false)}});
  window.onYouTubeIframeAPIReady=()=>{if(view==='room'&&room)bindPlayer()};
  if(name){view=new URLSearchParams(location.search).get('room')?'join':'name'}
  render();
})();
</script>
</body>
</html>
