/* === SyncBeat Future UI layer === */
:root{
  --surface-glow:rgba(139,92,246,.13);
  --surface-hot:rgba(94,231,255,.08);
  --focus:rgba(167,139,250,.48);
  --card-radius:24px;
}
html[data-theme="light"]{
  color-scheme:light;
  --bg:#f4f6fb;
  --surface:#ffffff;
  --surface2:#f6f7fb;
  --surface3:#eef1f7;
  --border:rgba(15,23,42,.10);
  --text:#111827;
  --muted:#667085;
  --muted2:#98a2b3;
  --shadow:0 24px 70px rgba(15,23,42,.10);
}
html[data-theme="light"] body{background:var(--bg);color:var(--text)}
html[data-theme="light"] .app{
  background:
    radial-gradient(circle at 8% -5%,rgba(124,58,237,.11),transparent 32%),
    radial-gradient(circle at 94% 15%,rgba(34,211,238,.10),transparent 28%),
    var(--bg);
}
html[data-theme="light"] .topbar{background:rgba(244,246,251,.82)}
html[data-theme="light"] .sidebar,
html[data-theme="light"] .mainPanel,
html[data-theme="light"] .chatPanel,
html[data-theme="light"] .card,
html[data-theme="light"] .homeCard{background:rgba(255,255,255,.84)}
html[data-theme="light"] .modeCard,
html[data-theme="light"] .roomCard,
html[data-theme="light"] .stat,
html[data-theme="light"] .person:hover,
html[data-theme="light"] .queueRow:hover,
html[data-theme="light"] .bubble,
html[data-theme="light"] .voicePerson,
html[data-theme="light"] .toggleBtn{background:rgba(15,23,42,.025)}
html[data-theme="light"] .input{background:#fff;color:var(--text)}
html[data-theme="light"] .input::placeholder{color:#98a2b3}
html[data-theme="light"] .btn{background:rgba(15,23,42,.025);color:var(--text)}
html[data-theme="light"] .btn:hover{background:rgba(15,23,42,.055)}
html[data-theme="light"] .tabBtn.active{background:#111827;color:#fff}
html[data-theme="light"] .modal{background:#fff;color:var(--text)}
html[data-theme="light"] .key{background:#eef1f7;color:#344054}

*{scrollbar-width:thin;scrollbar-color:#353a49 transparent}
body{overflow-x:hidden}
button,.btn,.modeCard,.round,.tabBtn,.queueRow,.person,.toggleBtn,.logo{will-change:transform}
.btn,.round,.modeCard,.card,.sidebar,.chatPanel,.mainPanel,.queueRow,.person,.toggleBtn{transition:transform .22s cubic-bezier(.2,.8,.2,1),border-color .22s ease,background .22s ease,box-shadow .22s ease}
.btn:hover:not(:disabled){box-shadow:0 10px 28px rgba(0,0,0,.10)}
.btnPrimary{position:relative;overflow:hidden}
.btnPrimary:after{content:"";position:absolute;inset:-40%;background:linear-gradient(110deg,transparent 25%,rgba(255,255,255,.22) 45%,transparent 65%);transform:translateX(-60%) rotate(8deg);animation:shine 3.8s ease-in-out infinite}
@keyframes shine{0%,58%{transform:translateX(-70%) rotate(8deg)}78%,100%{transform:translateX(75%) rotate(8deg)}}

.page,.roomGrid,.hero,.homeCard{animation:pageIn .5s cubic-bezier(.2,.8,.2,1) both}
@keyframes pageIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

.roomCard:before{content:"";display:block;height:3px;width:48px;border-radius:999px;background:linear-gradient(90deg,#8b5cf6,#5ee7ff);margin-bottom:12px;opacity:.8}
.roomHeader{padding:3px 2px 8px}
.roomHeader h1{font-size:23px}

.activity{display:inline-flex;align-items:center;gap:8px}
.activityMeter{height:18px;display:flex;align-items:flex-end;gap:2px;padding:3px 4px;border-radius:7px;background:rgba(139,92,246,.08);border:1px solid rgba(139,92,246,.14)}
.activityMeter span{width:2px;height:6px;border-radius:99px;background:#a78bfa;opacity:.5}
.activityMeter.on span{opacity:1;animation:beat 1s ease-in-out infinite}
.activityMeter span:nth-child(2){animation-delay:.12s}.activityMeter span:nth-child(3){animation-delay:.24s}.activityMeter span:nth-child(4){animation-delay:.36s}.activityMeter span:nth-child(5){animation-delay:.18s}
@keyframes beat{0%,100%{height:5px}50%{height:14px}}
.playerShell{border-radius:22px;box-shadow:0 20px 60px rgba(0,0,0,.22),inset 0 1px rgba(255,255,255,.03)}
.videoWrap{background:radial-gradient(circle at 50% 35%,#171a24,#020204)}
.videoWrap:after{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(180deg,transparent 62%,rgba(0,0,0,.18));z-index:1}
.playerControls{background:linear-gradient(180deg,rgba(17,19,28,.96),rgba(9,10,15,.98));padding:17px}

.controlButtons .roundMain{box-shadow:0 14px 32px rgba(255,255,255,.12)}
.controlButtons .round:hover:not(:disabled){transform:translateY(-2px) scale(1.03)}
.range{height:5px}
.range::-webkit-slider-thumb{appearance:none;width:13px;height:13px;border-radius:50%;background:#c4b5fd;box-shadow:0 0 0 5px rgba(139,92,246,.10);cursor:pointer}
.range::-moz-range-thumb{width:13px;height:13px;border:none;border-radius:50%;background:#c4b5fd;box-shadow:0 0 0 5px rgba(139,92,246,.10);cursor:pointer}
.contentGrid{grid-template-columns:minmax(0,1fr) 340px;gap:16px;margin-top:16px}
.card{border-radius:20px;padding:16px}
.card:hover{border-color:rgba(167,139,250,.14);box-shadow:0 18px 50px rgba(0,0,0,.12)}
.cardTitle{font-size:17px}
.queueAdd{margin-top:14px}.queueAdd .input{min-height:44px}.queueAdd .btn{min-width:82px}
.queue{gap:6px}
.queueRow{padding:9px;border-radius:14px}
.queueRow:hover{transform:translateX(2px)}
.qActions .btn{box-shadow:none}
.voiceCard{position:relative;overflow:hidden}.voiceCard:before{content:"";position:absolute;top:-60px;right:-30px;width:150px;height:150px;border-radius:50%;background:radial-gradient(circle,rgba(94,231,255,.09),transparent 70%);pointer-events:none}
.voiceButtons .btnPrimary{min-height:42px}
.voicePeople{max-height:170px;overflow:auto;padding-right:2px}
.chatPanel{min-height:calc(100vh - 114px)}
.chatTabs{padding:9px;background:rgba(255,255,255,.008)}
.tabBtn{font-size:10px}.tabBtn.active{box-shadow:0 8px 20px rgba(0,0,0,.12)}
.messages{padding:16px}.message{animation:messageIn .28s ease both}@keyframes messageIn{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}
.bubble{border-radius:14px;padding:9px 11px;box-shadow:0 5px 20px rgba(0,0,0,.06)}

.compose .input{min-height:42px}
.modeCard{position:relative;overflow:hidden}.modeCard:after{content:"";position:absolute;inset:auto -20% -50% 30%;height:130px;background:radial-gradient(circle,rgba(139,92,246,.12),transparent 65%);pointer-events:none;transition:transform .35s}
.modeCard:hover:after{transform:translateY(-25px)}
.modeIcon{box-shadow:inset 0 1px rgba(255,255,255,.05),0 12px 25px rgba(0,0,0,.10)}
.eyebrow{box-shadow:inset 0 1px rgba(255,255,255,.03)}
.topbar{box-shadow:0 10px 35px rgba(0,0,0,.10)}
.topbar .logo{padding:4px 0}.logoMark{box-shadow:0 0 0 1px rgba(255,255,255,.12),0 12px 30px rgba(124,58,237,.22)}
.mobileRoomNav{display:none}
.mobileRoomNav button{display:flex;align-items:center;justify-content:center;gap:7px;height:50px;border:1px solid var(--border);background:rgba(13,16,23,.92);backdrop-filter:blur(18px);color:var(--muted);font-size:10px;font-weight:800}
.mobileRoomNav button.active{color:#fff;background:linear-gradient(135deg,rgba(139,92,246,.30),rgba(94,231,255,.10));border-color:rgba(167,139,250,.30)}
.quickSync{display:flex;align-items:center;gap:6px;padding:8px 10px;border-radius:12px;border:1px solid rgba(49,217,139,.14);background:rgba(49,217,139,.04);color:#7cf4ba;font-size:9px;font-weight:800}
.quickSync .syncDot{animation:pulseDot 1.5s ease-in-out infinite}@keyframes pulseDot{0%,100%{box-shadow:0 0 0 0 rgba(49,217,139,.0)}50%{box-shadow:0 0 0 5px rgba(49,217,139,.08)}}
.playerMetaBar{display:flex;flex-wrap:wrap;align-items:center;gap:7px;margin-top:10px}

@media(max-width:1220px){
  .roomGrid{grid-template-columns:200px minmax(0,1fr) 330px;gap:12px}
  .contentGrid{grid-template-columns:minmax(0,1fr) 300px}
}
@media(max-width:1023px){
  .roomGrid{display:block}.sidebar{display:none}.mainPanel{border-radius:20px}.chatPanel{display:flex;position:relative;top:auto;min-height:520px;margin-top:12px}.contentGrid{grid-template-columns:1fr}.mobileRoomNav{display:grid;grid-template-columns:repeat(3,1fr);position:sticky;bottom:8px;z-index:45;gap:6px;margin:10px 0 0}.mobileRoomNav button:first-child{border-radius:14px 0 0 14px}.mobileRoomNav button:last-child{border-radius:0 14px 14px 0}.mobileOnlyNav{display:grid}

  .page{padding:9px}.topbar{height:62px}.logoMark{width:33px;height:33px}.logoText{font-size:15px}.topTitle .name{font-size:12px}.mainPanel{padding:10px}.playerShell{border-radius:18px}.playerControls{padding:11px}.controlRow{align-items:center}.controlButtons{gap:5px}.round{width:37px;height:37px}.roundMain{width:45px;height:45px}.controlButtons .round{font-size:9px}.controlGrid{gap:7px}.time{font-size:9px}.volumeRow{gap:7px}.volumeRow .personal{font-size:8px}.card{padding:12px;border-radius:17px}.cardSub{font-size:9px}.queueRow{padding:9px 4px}.thumb{width:60px;height:40px}.qTitle{font-size:10px}.qMeta{font-size:8px}.queueAdd{gap:7px}.queueAdd .input{min-height:42px}.voiceButtons{grid-template-columns:minmax(0,1fr) 42px 42px}.chatPanel{min-height:60vh;border-radius:17px}.messages{padding:12px}.compose{padding:8px}.compose .input{min-height:40px}.sendBtn{width:42px}.hero{padding-top:25px}.hero h1{font-size:41px}.hero p{font-size:12px}.homeInner{padding:20px}.modeCard{min-height:130px}.modeMeta{margin-top:12px}.mobileRoomNav{bottom:6px;margin:8px 0 0}.activityMeter{display:none}
}

<body>
<div id="app" class="app"></div>
<div id="toast" class="toast"></div>
<div id="modalRoot"></div>
<script>
(() => {
"use strict";
const SERVER = new URLSearchParams(location.search).get("server") || "https://syncbeat-live.onrender.com";
let socket = null;
let player = null;
let ytReady = false;
let currentVideoId = null;
let playerReady = false;
let playerError = "";
let playerLoadToken = 0;
let playbackTimer = null;
let lastServerPosition = 0;
let roomSyncReceivedAt = 0;
let serverClockOffset = 0;
let suppressPlayerEvents = false;
let autoplayBlocked = false;
let typingTimer = null;
let voice = { joined:false, muted:false, deaf:false, ptt:false, speaking:false, local:null, peers:new Map(), audios:new Map(), peerIds:new Set(), volumes:{}, pendingCandidates:new Map() };
let room = null;
let chat = [];
let tab = "chat";
let theme = localStorage.getItem("syncbeat:theme") || "dark";
let name = localStorage.getItem("syncbeat:name") || "";
let modeError = "";
let homeView = "name";
let roomPassword = "";
let joinCode = new URLSearchParams(location.search).get("room")?.toUpperCase() || "";

function esc(s){const d=document.createElement("div");d.textContent=String(s??"");return d.innerHTML;}
function icon(name,size=16){return `<i data-lucide="${name}" width="${size}" height="${size}"></i>`;}
function icons(){if(window.lucide)lucide.createIcons();}
function showToast(t){const e=document.getElementById("toast");e.textContent=t;e.classList.add("show");clearTimeout(showToast.t);showToast.t=setTimeout(()=>e.classList.remove("show"),1700);}
function fmt(n){n=Math.max(0,Math.floor(Number(n)||0));return Math.floor(n/60)+":"+String(n%60).padStart(2,"0");}
function initials(s){return (String(s||"?").trim()[0]||"?").toUpperCase();}
function getMe(){return room?.participants?.find(p=>p.id===socket?.id)||null;}
function isHost(){return Boolean(room&&socket&&room.hostId===socket.id);}
function canControl(){const p=getMe();return Boolean(isHost()||p?.canControl);}
function modeScreen(){
 const invited=Boolean(joinCode);
 return `<div class="page homeShell"><header class="topbar" style="position:relative;top:auto;left:auto;right:auto;margin:0 -22px;background:transparent;border:0"><div class="logo">${icon("music-2",18)}<span class="logoText">SyncBeat</span></div><div class="topTitle"></div><button class="btn btnIcon" id="themeBtn" title="Toggle theme">${icon(theme==="dark"?"sun":"moon",16)}</button></header>
 <section class="hero"><div class="eyebrow">${icon("radio",12)} PRIVATE REAL-TIME LISTENING</div><h1>Music feels better<br/><span class="grad">when you're together.</span></h1><p>One clean place for YouTube listening, shared playback, rooms, chat and live voice. Your room stays under your control.</p></section>
 <div class="homeCard"><div class="homeInner">${
  homeView==="name"?`
   <div class="stepTitle">What should we call you?</div><div class="stepSub">Enter your name once. We'll keep it on this device for your next room.</div>
   <div class="field"><span class="label">Your name</span><input id="nameInput" class="input" maxlength="32" autofocus placeholder="e.g. Abhi" value="${esc(name)}" /></div>
   ${modeError?`<div class="voiceError">${esc(modeError)}</div>`:""}
   <button class="btn btnPrimary" id="saveName" style="width:100%;margin-top:2px">Enter SyncBeat ${icon("arrow-right",16)}</button>`
  :homeView==="mode"?`
   <div style="text-align:center"><div class="stepTitle">Hey, ${esc(name)} <span style="filter:saturate(.7)">👋</span></div><div class="stepSub">How do you want to listen today?</div></div>
   ${modeError?`<div class="voiceError" style="margin-top:14px">${esc(modeError)}</div>`:""}
   <div class="modeGrid">
    <button class="modeCard" data-mode="solo"><div class="modeIcon">${icon("headphones",21)}</div><h3>Listen solo</h3><p>Play a YouTube video privately with your own controls.</p><div class="modeMeta"><span>Just you</span>${icon("arrow-up-right",14)}</div></button>
    <button class="modeCard featured" data-mode="create"><div class="modeIcon">${icon("users-round",21)}</div><h3>Create a room</h3><p>Host synchronized music, manage DJs, chat and talk in voice.</p><div class="modeMeta"><span>Host controls</span>${icon("arrow-up-right",14)}</div></button>
    <button class="modeCard" data-mode="join"><div class="modeIcon">${icon("log-in",21)}</div><h3>Join a room</h3><p>Use a friend's 6-character room code and jump in.</p><div class="modeMeta"><span>${invited?"Invite ready":"Have a code?"}</span>${icon("arrow-up-right",14)}</div></button>
   </div>`
  :homeView==="create"?`
   <button class="btn" data-back="mode" style="padding:7px 9px;margin-bottom:13px">${icon("arrow-left",13)} Back</button><div class="stepTitle">Create a private room</div><div class="stepSub">You'll be the host. You can later give playback power to specific friends.</div>
   <div class="field"><span class="label">Room name</span><input id="roomNameInput" class="input" maxlength="60" value="Friday Night Mix" autofocus /></div>
   <div class="field"><span class="label">Password (optional)</span><input id="roomPassInput" class="input" type="password" maxlength="100" placeholder="Leave blank for invite-link access" /></div>
   ${modeError?`<div class="voiceError">${esc(modeError)}</div>`:""}
   <button class="btn btnPrimary" id="createRoom" style="width:100%;margin-top:16px">Create room ${icon("plus",16)}</button>`
  :`
   <button class="btn" data-back="mode" style="padding:7px 9px;margin-bottom:13px">${icon("arrow-left",13)} Back</button><div class="stepTitle">Join a friend's room</div><div class="stepSub">${joinCode?"Your invite already contains the room code.":"Enter the 6-character code from your friend."}</div>
   <div class="field"><span class="label">Room code</span><input id="joinCodeInput" class="input" maxlength="6" value="${esc(joinCode)}" placeholder="ABC123" style="font-family:ui-monospace;letter-spacing:.28em;text-transform:uppercase" /></div>
   <div class="field"><span class="label">Password (if required)</span><input id="joinPassInput" class="input" type="password" maxlength="100" /></div>
   ${modeError?`<div class="voiceError">${esc(modeError)}</div>`:""}
   <button class="btn btnPrimary" id="joinRoom" style="width:100%;margin-top:16px">Join room ${icon("log-in",16)}</button>`
 }</div></div>
 <div class="tips"><span>${icon("youtube",12)} Official YouTube embeds</span><span>${icon("mic",12)} WebRTC voice</span><span>${icon("shield-check",12)} Host moderation</span></div></div>`;
}

function soloScreen(){
 return `<div class="page"><div style="max-width:1100px;margin:0 auto"><header class="topbar" style="position:relative;top:auto;left:auto;right:auto;margin:0 -22px"><button class="logo" id="soloBack" style="background:none"><span class="logoMark">${icon("music-2",18)}</span><span class="logoText">SyncBeat</span></button><div class="topTitle"><div class="name">Listen solo</div><div class="sub">${esc(name)}</div></div><button class="btn btnIcon" id="soloTheme">${icon(theme==="dark"?"sun":"moon",16)}</button></header>
 <div style="padding-top:28px"><div class="eyebrow">${icon("headphones",12)} SOLO LISTENING</div><h1 style="font-family:'Space Grotesk';font-size:clamp(34px,5vw,58px);letter-spacing:-.05em;margin:14px 0 0">Your own listening space.</h1><p style="color:var(--muted);font-size:13px;margin-top:8px">Paste any valid YouTube URL or video ID and use the official YouTube player.</p>
 <div class="card" style="margin-top:18px"><div style="display:flex;gap:8px;flex-wrap:wrap"><input id="soloUrl" class="input" style="flex:1;min-width:220px" placeholder="https://youtube.com/watch?v=..."/><button id="soloLoad" class="btn btnPrimary">Load video ${icon("play",14)}</button></div></div>
 <div class="playerShell" style="margin-top:14px"><div class="videoWrap"><div id="soloMount"></div><div id="soloFallback" class="videoFallback"><div><div class="vIcon">${icon("music-2",24)}</div><h3>Paste a YouTube link to start</h3><p>SyncBeat doesn't download or extract audio. It uses YouTube's official embedded player.</p></div></div></div>
 <div class="playerControls"><div class="controlRow"><div class="nowInfo"><div class="controlLabel">SOLO PLAYER</div><div id="soloStatus" class="controlHint">Ready</div></div><div class="controlButtons"><button id="soloBack10" class="round">−10</button><button id="soloPlay" class="round roundMain" disabled>${icon("play",18)}</button><button id="soloFwd10" class="round">+10</button></div></div><div class="controlGrid"><span id="soloPos" class="time">0:00</span><input id="soloRange" class="range" type="range" min="0" max="1" value="0" disabled/><span id="soloDur" class="time">0:00</span></div><div class="volumeRow">${icon("volume-2",14)}<input id="soloVol" class="range" style="max-width:150px" type="range" min="0" max="100" value="${localStorage.getItem("syncbeat:vol")||70}"/><span class="personal">Personal volume</span><button id="soloFull" class="btn btnIcon" style="margin-left:auto">${icon("maximize-2",15)}</button></div></div></div></div></div></div>`;
}

function roomScreen(){
 const me=getMe();
 const control=canControl();
 const host=isHost();
 return `<header class="topbar"><button class="logo focusRing" id="leaveTop" style="background:transparent" aria-label="Back to home"><span class="logoMark">${icon("music-2",18)}</span><span class="logoText">SyncBeat</span></button><div class="topTitle"><div class="name">${esc(room.name)} ${host?'<span class="pill pillViolet" style="margin-left:6px;padding:4px 7px">'+icon("shield-check",10)+' HOST</span>':me?.canControl?'<span class="pill pillCyan" style="margin-left:6px;padding:4px 7px">'+icon("radio-tower",10)+' DJ</span>':''}</div><div class="sub">#${esc(room.code)} • ${room.participants.length} online</div></div><div class="status"><span class="statusDot"></span> Connected</div><div class="desktopOnly" style="display:flex;align-items:center;gap:7px"><div class="quickSync"><span class="syncDot"></span>${room.current?(room.isPlaying?"Synced":"Ready"):"Waiting for a song"}</div></div><button id="shareTop" class="btn desktopOnly">${icon("share-2",14)} Share room</button><button id="settingsTop" class="btn btnIcon focusRing" title="Room settings">${icon("sliders-horizontal",15)}</button><button id="themeTop" class="btn btnIcon focusRing" title="Theme">${icon(theme==="dark"?"sun":"moon",15)}</button><button id="leaveTop2" class="btn btnIcon btnDanger focusRing" title="Leave room">${icon("log-out",15)}</button></header>
 <div class="page"><div class="roomGrid">
  <aside class="sidebar"><div class="roomCard"><div class="roomLabel">PRIVATE ROOM</div><div class="roomName">${esc(room.name)}</div><div class="roomCode">#${esc(room.code)}</div><div class="playerMetaBar"><span class="pill pillGreen">${icon("radio",11)} ${room.participants.length} online</span><span class="pill">${icon("list-music",11)} ${room.queue.length} next</span></div></div><div class="sectionTitle">People</div><div id="peopleList">${peopleHtml()}</div><div class="sidebarBottom"><button id="copyInvite" class="btn" style="width:100%">${icon("link",14)} Copy invite link</button><button id="leaveSide" class="btn btnDanger" style="width:100%;margin-top:7px">${icon("log-out",14)} Leave room</button></div></aside>
  <main class="mainPanel" id="mainRoom"><div class="roomHeader"><div style="min-width:0"><div class="label2">LISTENING TOGETHER</div><h1 id="roomHeading">${esc(room.current?.title||"Nothing is playing yet")}</h1><div class="playerMetaBar"><span class="pill ${room.isPlaying?'pillGreen':'pillViolet'}"><span class="activity"><span class="activityMeter ${room.isPlaying?'on':''}"><span></span><span></span><span></span><span></span><span></span></span>${room.isPlaying?"Everyone is listening":"Ready for the next track"}</span></span>${control?'<span class="pill pillCyan">'+icon("sliders-horizontal",11)+' Your controls</span>':'<span class="pill">'+icon("lock",11)+' Host / DJ controlled</span>'}</div></div></div><div class="playerShell"><div class="videoWrap"><div id="playerMount"></div><div id="playerFallback" class="videoFallback"><div><div class="vIcon">${icon("music-2",24)}</div><h3>${room.current?"Loading video":"Add your first song"}</h3><p>${room.current?"Loading the official YouTube player. If YouTube rejects this embed, SyncBeat will show the actual error.":"Paste a YouTube link in the queue below. The first track becomes ready to play for everyone."}</p></div></div></div><div class="playerControls"><div class="controlRow"><div class="nowInfo"><div class="controlLabel">${control?"SHARED PLAYER • DJ CONTROL":"SHARED PLAYER"}</div><div class="controlHint">${room.current?esc(room.current.title):"Waiting for a track to be added"}</div></div><div class="controlButtons"><button id="back10" class="round focusRing" ${control?"":"disabled"}>−10</button><button id="playPause" class="round roundMain focusRing" ${control&&room.current?"":"disabled"}>${icon(room.isPlaying?"pause":"play",18)}</button><button id="fwd10" class="round focusRing" ${control?"":"disabled"}>+10</button><button id="nextTrack" class="round focusRing" ${control&&room.queue.length?"":"disabled"} title="Play next">${icon("skip-forward",16)}</button></div></div><div class="controlGrid"><span id="timePos" class="time">${fmt(room.position)}</span><input id="playerRange" class="range" type="range" min="0" max="1" value="${Math.max(0,Math.floor(room.position))}" ${control&&room.current?"":"disabled"}/><span id="timeDur" class="time">0:00</span></div><div class="volumeRow">${icon("volume-2",14)}<input id="personalVol" class="range" style="max-width:160px" type="range" min="0" max="100" value="${localStorage.getItem("syncbeat:vol")||70}"/><span class="personal">Personal volume</span><span class="syncBadge"><span class="syncDot"></span>${room.current?(room.isPlaying?"Playing in sync":"Paused for everyone"):"Waiting for a track"}</span><button id="fullPlayer" class="btn btnIcon focusRing" style="margin-left:8px" title="Fullscreen">${icon("maximize-2",15)}</button></div><div class="playerMetaBar"><span class="pill">${icon("shield-check",11)} YouTube official embed</span><span class="pill">${icon("zap",11)} Low-latency sync</span><span class="shortcutHint">Space play/pause • C chat • M mute • V talk</span></div></div></div>
   <div class="contentGrid"><section id="queueCard" class="card"><div class="cardHead"><div><div class="sectionTitle" style="margin:0;color:#b39bff">UP NEXT</div><div class="cardTitle">Shared queue</div><div class="cardSub">Everyone can add songs. Only the host and approved DJs control playback.</div></div><span class="pill">${room.queue.length}</span></div><div class="queueAdd"><input id="queueInput" class="input" placeholder="Paste YouTube URL or video ID" aria-label="YouTube URL or video ID"/><button id="queueAdd" class="btn btnPrimary">${icon("plus",14)} Add song</button></div><div id="queueList" class="queue">${queueHtml()}</div></section><section id="voiceCard" class="card voiceCard"><div class="voiceTop"><div><div class="sectionTitle" style="margin:0;color:#7be9ff">LIVE VOICE</div><div class="cardTitle">Talk together</div></div><span id="voiceStatus" class="pill ${voice.joined?'pillGreen':''}">${voice.joined?"ON":"OFF"}</span></div><div class="cardSub" style="margin-top:5px">Peer-to-peer WebRTC voice. Use normal mic or hold V for push-to-talk.</div><div class="voiceButtons"><button id="voiceJoin" class="btn btnPrimary">${voice.joined?"Leave voice":"Join voice"}</button><button id="voiceMute" class="btn" ${voice.joined?"":"disabled"} title="Mute microphone">${icon(voice.muted?"mic-off":"mic",15)}</button><button id="voiceDeaf" class="btn" ${voice.joined?"":"disabled"} title="Deafen">${icon("headphones",15)}</button></div><div class="voiceExtra"><button id="voicePtt" class="toggleBtn ${voice.ptt?"active":""}" ${voice.joined?"":"disabled"}>${voice.ptt?"Push-to-talk • V":"Normal microphone"}</button><label class="toggleBtn" style="display:flex;align-items:center;gap:6px;justify-content:center"><input id="lowBandwidth" type="checkbox" ${localStorage.getItem("syncbeat:low") === "1"?"checked":""}/> Low bandwidth</label></div><div id="voiceError"></div><div id="voicePeople" class="voicePeople">${voicePeopleHtml()}</div></section></div>
  </main>
  <aside id="chatPanel" class="chatPanel"><div class="chatTabs"><button id="tabChat" class="tabBtn ${tab==="chat"?"active":""}">${icon("message-circle",13)} Chat</button><button id="tabPeople" class="tabBtn ${tab==="people"?"active":""}">${icon("users",13)} People</button><button id="roomMore" class="btn btnIcon focusRing" style="width:34px;height:34px;margin-left:auto" title="Room controls & shortcuts">${icon("more-horizontal",15)}</button></div><div id="chatContent" class="chatContent">${tab==="chat"?chatHtml():peoplePanelHtml()}</div></aside>
 </div><div class="mobileRoomNav" id="mobileRoomNav"><button data-mobile-tab="chat" class="focusRing ${tab==="chat"?"active":""}">${icon("message-circle",15)} Chat</button><button data-mobile-tab="people" class="focusRing ${tab==="people"?"active":""}">${icon("users",15)} People</button><button data-mobile-tab="voice" class="focusRing">${icon("mic",15)} Voice</button></div></div>`;
}

function peopleHtml(){
 return room.participants.map(p=>`<div class="person"><div class="avatar">${esc(initials(p.name))}</div><div class="personInfo"><div class="personName">${esc(p.name)}${p.id===socket.id?" (you)":""}</div><div class="personBadges">${p.isHost?'<span class="tinyBadge" style="color:#ffd77b">HOST</span>':p.canControl?'<span class="tinyBadge" style="color:#8beeff">DJ</span>':''}${p.voiceJoined?'<span class="tinyBadge" style="color:#7cf4ba">VOICE</span>':''}${p.muted?'<span class="tinyBadge" style="color:#ff889a">MUTED</span>':''}</div></div>${isHost()&&p.id!==socket.id?`<button class="btn btnIcon" style="width:32px;height:32px" data-user-actions="${esc(p.id)}" title="Participant controls">${icon("user-cog",14)}</button>`:""}</div>`).join("");
}
function peoplePanelHtml(){return `<div style="padding:12px"><div class="sectionTitle" style="margin:3px 3px 10px">ROOM MEMBERS</div>${peopleHtml()}</div>`}
function chatHtml(){
 return `<div style="height:100%;display:flex;flex-direction:column"><div id="messages" class="messages">${chat.length?chat.map(messageHtml).join(""):emptyChatHtml()}<div id="typingLine"></div></div><div style="position:relative"><div class="compose"><input id="chatInput" class="input" placeholder="Message the room…" maxlength="500"/><button id="emojiBtn" class="btn btnIcon" title="Add reaction">${icon("smile-plus",15)}</button><button id="sendChat" class="btn btnPrimary sendBtn" title="Send">${icon("send",15)}</button></div><div id="picker" class="picker hidden"></div></div></div>`;
}
function emptyChatHtml(){return `<div style="min-height:300px;height:100%;display:grid;place-items:center;text-align:center"><div><div class="vIcon" style="margin:auto;width:46px;height:46px">${icon("message-circle",21)}</div><div style="font-family:'Space Grotesk';font-size:15px;margin-top:12px">Start the conversation</div><div style="font-size:10px;color:#596171;margin-top:5px">Messages are live for everyone in this room.</div></div></div>`}
function messageHtml(m){
 if(m.userId==="system")return `<div class="systemMessage">${esc(m.text)}</div>`;
 const r=Object.entries(m.reactions||{}).filter(([,v])=>Array.isArray(v)&&v.length).map(([k,v])=>`<button class="reactBtn" data-react-id="${esc(m.id)}" data-react-key="${esc(k)}">${reactionIcon(k)} ${v.length}</button>`).join("");
 return `<div class="message"><div class="messageHead"><span class="messageName">${esc(m.name)}</span><span class="messageTime">${new Date(m.ts).toLocaleTimeString([],{hour:"2-digit",minute:"2-digit"})}</span></div><div class="bubble">${esc(m.text)}</div><div class="reactionRow">${r}<button class="reactBtn" data-open-react="${esc(m.id)}">${icon("plus",10)} React</button></div></div>`;
}
function reactionIcon(k){const map={heart:"heart",like:"thumbs-up",spark:"sparkles",clap:"hand",fire:"flame",laugh:"laugh"};return icon(map[k]||"sparkles",10)}
function queueHtml(){
 if(!room.queue.length)return `<div class="empty">${icon("list-music",22)}<p>No songs queued yet.</p><div style="font-size:9px;color:#454d5b;margin-top:4px">Paste a YouTube link above to add the first one.</div></div>`;
 const control=canControl();
 return room.queue.map((s,i)=>`<div class="queueRow" draggable="${control}" data-q-index="${i}"><span class="drag">${control?icon("grip-vertical",14):(i+1)}</span><img class="thumb" src="${esc(s.thumbnail)}" alt=""/><div class="qInfo"><div class="qTitle">${esc(s.title)}</div><div class="qMeta">Added by ${esc(s.addedBy||"Guest")}</div></div>${control?`<div class="qActions"><button class="btn btnIcon" style="width:32px;height:32px" data-play-queue="${i}" title="Play now">${icon("play",13)}</button><button class="btn btnIcon btnDanger" style="width:32px;height:32px" data-remove-queue="${i}" title="Remove">${icon("x",13)}</button></div>`:""}</div>`).join("");
}
function voicePeopleHtml(){if(!voice.joined)return "";if(!voice.peerIds.size)return `<div style="font-size:9px;color:#51596a">No other voice participants yet.</div>`;return [...voice.peerIds].map(id=>{const p=room.participants.find(x=>x.id===id);return `<div class="voicePerson"><div class="avatar" style="width:26px;height:26px;font-size:8px">${esc(initials(p?.name||id))}</div><span>${esc(p?.name||("User "+id.slice(0,6)))}</span><input data-peer-vol="${esc(id)}" type="range" min="0" max="100" value="${voice.volumes[id]??100}" class="range" style="width:82px"/></div>`}).join("")}

function render(){
 const app=document.getElementById("app");
 if(!room){app.innerHTML=homeView==="solo"?soloScreen():modeScreen();bindHome();bindSolo();icons();return;}
 app.innerHTML=roomScreen();bindRoom();icons();initRoomPlayer();
}
function bindHome(){
 document.getElementById("themeBtn")?.addEventListener("click",toggleTheme);
 document.getElementById("saveName")?.addEventListener("click",()=>{const v=document.getElementById("nameInput")?.value.trim();if(!v){modeError="Please enter your name.";render();return}name=v;localStorage.setItem("syncbeat:name",name);modeError="";homeView="mode";render()});
 document.getElementById("nameInput")?.addEventListener("keydown",e=>{if(e.key==="Enter")document.getElementById("saveName")?.click()});
 document.querySelectorAll("[data-mode]").forEach(b=>b.addEventListener("click",()=>{homeView=b.dataset.mode;modeError="";if(homeView==="solo"){render();return}render()}));
 document.querySelectorAll("[data-back]").forEach(b=>b.addEventListener("click",()=>{homeView=b.dataset.back;modeError="";render()}));
 document.getElementById("createRoom")?.addEventListener("click",createRoom);
 document.getElementById("joinRoom")?.addEventListener("click",joinRoom);
 document.getElementById("joinCodeInput")?.addEventListener("input",e=>joinCode=e.target.value.replace(/[^a-z0-9]/gi,"").slice(0,6).toUpperCase());
 document.getElementById("joinCodeInput")?.addEventListener("keydown",e=>{if(e.key==="Enter")document.getElementById("joinRoom")?.click()});
}
function bindSolo(){
 document.getElementById("soloBack")?.addEventListener("click",()=>{homeView="mode";render()});document.getElementById("soloTheme")?.addEventListener("click",toggleTheme);
 document.getElementById("soloLoad")?.addEventListener("click",loadSolo);document.getElementById("soloUrl")?.addEventListener("keydown",e=>{if(e.key==="Enter")loadSolo()});document.getElementById("soloPlay")?.addEventListener("click",()=>{if(!player)return;player.getPlayerState()===1?player.pauseVideo():player.playVideo()});
 document.getElementById("soloBack10")?.addEventListener("click",()=>soloSeek(-10));document.getElementById("soloFwd10")?.addEventListener("click",()=>soloSeek(10));document.getElementById("soloRange")?.addEventListener("input",e=>player?.seekTo(Number(e.target.value),true));document.getElementById("soloVol")?.addEventListener("input",e=>{const v=Number(e.target.value);player?.setVolume(v);if(v===0)player?.mute();else player?.unMute()});document.getElementById("soloFull")?.addEventListener("click",()=>player?.getIframe?.()?.requestFullscreen?.());
 if(currentVideoId&&playerReady)initPlayerStateUI("solo");
}
function bindRoom(){
 document.getElementById("shareTop")?.addEventListener("click",copyInvite);document.getElementById("copyInvite")?.addEventListener("click",copyInvite);document.getElementById("themeTop")?.addEventListener("click",toggleTheme);document.getElementById("settingsTop")?.addEventListener("click",openRoomInfo);document.getElementById("roomMore")?.addEventListener("click",openRoomInfo);document.getElementById("leaveTop")?.addEventListener("click",leaveRoom);document.getElementById("leaveTop2")?.addEventListener("click",leaveRoom);document.getElementById("leaveSide")?.addEventListener("click",leaveRoom);
 document.getElementById("playPause")?.addEventListener("click",()=>{if(!canControl())return;if(!room.current){startFirstQueued(true);return}socket.emit("player:action",{type:room.isPlaying?"pause":"play",position:getPlayerTime()})});document.getElementById("back10")?.addEventListener("click",()=>roomSeek(-10));document.getElementById("fwd10")?.addEventListener("click",()=>roomSeek(10));document.getElementById("nextTrack")?.addEventListener("click",()=>canControl()&&socket.emit("player:action",{type:"next"}));document.getElementById("playerRange")?.addEventListener("input",e=>roomSeekTo(Number(e.target.value)));
 document.getElementById("personalVol")?.addEventListener("input",e=>{const v=Number(e.target.value);localStorage.setItem("syncbeat:vol",String(v));player?.setVolume(v);if(v===0)player?.mute();else player?.unMute()});document.getElementById("fullPlayer")?.addEventListener("click",()=>player?.getIframe?.()?.requestFullscreen?.());
 document.getElementById("queueAdd")?.addEventListener("click",addQueue);document.getElementById("queueInput")?.addEventListener("keydown",e=>{if(e.key==="Enter")addQueue()});bindQueueEvents();bindPeopleEvents();
 document.getElementById("tabChat")?.addEventListener("click",()=>{tab="chat";rerenderRoomBody()});document.getElementById("tabPeople")?.addEventListener("click",()=>{tab="people";rerenderRoomBody()});document.querySelectorAll("[data-mobile-tab]").forEach(b=>b.addEventListener("click",()=>{const next=b.dataset.mobileTab;document.querySelectorAll("[data-mobile-tab]").forEach(n=>n.classList.toggle("active",n.dataset.mobileTab===next));if(next==="voice"){document.getElementById("voiceCard")?.scrollIntoView({behavior:"smooth",block:"center"});return}tab=next;rerenderRoomBody();setTimeout(()=>document.getElementById("chatPanel")?.scrollIntoView({behavior:"smooth",block:"start"}),30)}));
 document.getElementById("voiceJoin")?.addEventListener("click",()=>voice.joined?leaveVoice():joinVoice());document.getElementById("voiceMute")?.addEventListener("click",toggleVoiceMute);document.getElementById("voiceDeaf")?.addEventListener("click",()=>{voice.deaf=!voice.deaf;Object.values(voice.audios).forEach(a=>a.muted=voice.deaf);renderRoomVoice()});document.getElementById("voicePtt")?.addEventListener("click",()=>{voice.ptt=!voice.ptt;localStorage.setItem("syncbeat:ptt",voice.ptt?"1":"0");renderRoomVoice()});document.getElementById("lowBandwidth")?.addEventListener("change",e=>localStorage.setItem("syncbeat:low",e.target.checked?"1":"0"));
 document.querySelectorAll("[data-open-react]").forEach(b=>b.addEventListener("click",()=>openReactionPicker(b.dataset.openReact)));document.querySelectorAll("[data-react-id]").forEach(b=>b.addEventListener("click",()=>socket.emit("chat:react",{id:b.dataset.reactId,emoji:b.dataset.reactKey})));
 document.getElementById("sendChat")?.addEventListener("click",sendChat);document.getElementById("chatInput")?.addEventListener("keydown",e=>{if(e.key==="Enter")sendChat()});document.getElementById("chatInput")?.addEventListener("input",e=>{socket.emit("chat:typing",Boolean(e.target.value.trim()));clearTimeout(typingTimer);typingTimer=setTimeout(()=>socket.emit("chat:typing",false),1100)});document.getElementById("emojiBtn")?.addEventListener("click",()=>openReactionPicker(null));
 document.querySelectorAll("[data-user-actions]").forEach(b=>b.addEventListener("click",()=>openUserMenu(b.dataset.userActions)));
}
function rerenderRoomBody(){if(!room)return;const p=document.getElementById("chatContent");if(p){p.innerHTML=tab==="chat"?chatHtml():peoplePanelHtml();icons();if(tab==="chat")bindChatOnly();}document.querySelectorAll("[data-user-actions]").forEach(b=>b.addEventListener("click",()=>openUserMenu(b.dataset.userActions)));}
function bindChatOnly(){document.getElementById("sendChat")?.addEventListener("click",sendChat);document.getElementById("chatInput")?.addEventListener("keydown",e=>{if(e.key==="Enter")sendChat()});document.getElementById("chatInput")?.addEventListener("input",e=>{socket.emit("chat:typing",Boolean(e.target.value.trim()));clearTimeout(typingTimer);typingTimer=setTimeout(()=>socket.emit("chat:typing",false),1100)});document.getElementById("emojiBtn")?.addEventListener("click",()=>openReactionPicker(null));document.querySelectorAll("[data-open-react]").forEach(b=>b.addEventListener("click",()=>openReactionPicker(b.dataset.openReact)));document.querySelectorAll("[data-react-id]").forEach(b=>b.addEventListener("click",()=>socket.emit("chat:react",{id:b.dataset.reactId,emoji:b.dataset.reactKey})));setTimeout(()=>document.getElementById("messages")?.lastElementChild?.scrollIntoView({behavior:"smooth"}),0)}
function bindQueueEvents(){const q=document.getElementById("queueList");if(!q||q.dataset.bound==="1")return;q.dataset.bound="1";let from=null;q.addEventListener("click",e=>{const target=e.target.closest?.("[data-play-queue],[data-remove-queue]");if(!target)return;if(target.dataset.playQueue!=null){const i=Number(target.dataset.playQueue);const song=room?.queue?.[i];if(song&&canControl())playQueueItem(i)}else if(target.dataset.removeQueue!=null){const i=Number(target.dataset.removeQueue);if(canControl()&&Number.isInteger(i))socket.emit("queue:remove",i)}});q.addEventListener("dragstart",e=>{const row=e.target.closest?.("[data-q-index]");if(!row||!canControl())return;from=Number(row.dataset.qIndex);e.dataTransfer?.setData("text/plain",String(from))});q.addEventListener("dragover",e=>{if(e.target.closest?.("[data-q-index]"))e.preventDefault()});q.addEventListener("drop",e=>{const row=e.target.closest?.("[data-q-index]");if(!row||!canControl())return;const to=Number(row.dataset.qIndex);if(Number.isInteger(from)&&Number.isInteger(to)&&from!==to)socket.emit("queue:reorder",{from,to});from=null})}
function bindPeopleEvents(){const list=document.getElementById("peopleList");if(!list||list.dataset.bound==="1")return;list.dataset.bound="1";list.addEventListener("click",e=>{const b=e.target.closest?.("[data-user-actions]");if(b&&isHost())openUserMenu(b.dataset.userActions)})}
function bindDrag(){bindQueueEvents()}
function sendChat(){const i=document.getElementById("chatInput");if(!i)return;const t=i.value.trim();if(t){socket.emit("chat:send",t);i.value="";socket.emit("chat:typing",false)}}
function openReactionPicker(messageId){const root=document.getElementById("modalRoot");root.innerHTML=`<div class="modalBack" id="reactBack"><div class="modal" style="width:min(430px,100%)"><div class="modalHead"><h3>${messageId?"React to message":"Pick a reaction"}</h3><button class="btn btnIcon" id="closeReact">${icon("x",14)}</button></div><div class="modalBody" style="margin-top:10px">Choose a subtle reaction. The chat UI stays icon-first; these are message reactions only.</div><div style="display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px">${[["heart","Heart"],["like","Like"],["spark","Spark"],["clap","Clap"],["fire","Fire"],["laugh","Laugh"]].map(([k,l])=>`<button class="btn" data-pick-react="${k}" style="justify-content:flex-start">${reactionIcon(k)} ${l}</button>`).join("")}</div></div></div>`;icons();document.getElementById("closeReact").onclick=()=>root.innerHTML="";document.getElementById("reactBack").onclick=e=>{if(e.target.id==="reactBack")root.innerHTML=""};document.querySelectorAll("[data-pick-react]").forEach(b=>b.addEventListener("click",()=>{if(messageId)socket.emit("chat:react",{id:messageId,emoji:b.dataset.pickReact});root.innerHTML=""}))}
function openUserMenu(id){const p=room.participants.find(x=>x.id===id);if(!p||!isHost())return;const root=document.getElementById("modalRoot");root.innerHTML=`<div class="modalBack" id="userBack"><div class="modal"><div class="modalHead"><div><h3>${esc(p.name)}</h3><div class="cardSub">Participant controls</div></div><button class="btn btnIcon" id="closeUser">${icon("x",14)}</button></div><div style="display:grid;gap:8px;margin-top:16px"><button id="togglePower" class="btn">${icon("sliders-horizontal",14)} ${p.canControl?"Remove DJ power":"Give DJ power"}</button><button id="makeHost" class="btn">${icon("crown",14)} Make host</button><button id="kickUser" class="btn btnDanger">${icon("user-minus",14)} Remove participant</button></div></div></div>`;icons();document.getElementById("closeUser").onclick=()=>root.innerHTML="";document.getElementById("togglePower").onclick=()=>{socket.emit("participant:set-control",id);root.innerHTML=""};document.getElementById("makeHost").onclick=()=>{socket.emit("host:transfer",id);root.innerHTML=""};document.getElementById("kickUser").onclick=()=>{socket.emit("participant:kick",id);root.innerHTML=""}}
function openRoomInfo(){const root=document.getElementById("modalRoot");root.innerHTML=`<div class="modalBack" id="infoBack"><div class="modal"><div class="modalHead"><div><h3>Room controls</h3><div class="cardSub">Clear rules for everyone in the room</div></div><button class="btn btnIcon" id="closeInfo">${icon("x",14)}</button></div><div class="modalBody" style="margin-top:13px">${isHost()?"You are the host. You can control playback, remove participants, transfer hosting and give DJ power to selected users.":canControl()?"You have DJ power. You can control shared playback, but the host remains the room owner.":"Only the host and approved DJs can control the shared player."}</div><div class="shortcutGrid"><div class="shortcut"><span>Play / pause</span><span class="key">Space</span></div><div class="shortcut"><span>Focus chat</span><span class="key">C</span></div><div class="shortcut"><span>Mute voice</span><span class="key">M</span></div><div class="shortcut"><span>Push to talk</span><span class="key">V</span></div></div><button id="infoCopy" class="btn" style="width:100%;margin-top:12px">${icon("copy",14)} Copy room invite</button></div></div>`;icons();document.getElementById("closeInfo").onclick=()=>root.innerHTML="";document.getElementById("infoBack").onclick=e=>{if(e.target.id==="infoBack")root.innerHTML=""};document.getElementById("infoCopy").onclick=copyInvite}
function toggleTheme(){theme=theme==="dark"?"light":"dark";localStorage.setItem("syncbeat:theme",theme);document.documentElement.dataset.theme=theme;render();}
function connect(){if(socket?.connected)return Promise.resolve();return new Promise(resolve=>{if(!socket){socket=io(SERVER,{transports:["websocket","polling"],autoConnect:false});wireSocket();}socket.connect();socket.once("connect",resolve);socket.once("connect_error",()=>resolve())})}
function wireSocket(){
 socket.on("room:state",s=>{const first=!room;room=s;if(Number.isFinite(s?.updatedAt))serverClockOffset=s.updatedAt-Date.now();roomSyncReceivedAt=performance.now();if(first)render();else refreshRoomState();});socket.on("chat:message",m=>{chat=[...chat,m].slice(-200);if(room&&tab==="chat")refreshChat();});socket.on("chat:reaction",x=>{chat=chat.map(m=>m.id===x.id?{...m,reactions:x.reactions}:m);if(room&&tab==="chat")refreshChat()});socket.on("chat:typing",x=>{const el=document.getElementById("typingLine");if(el){el.innerHTML=x?.typing?`<div style="font-size:9px;color:#596273;margin-top:4px">${esc(x.name||"Someone")} is typing…</div>`:""}});socket.on("room:kicked",()=>{leaveVoice();room=null;chat=[];homeView="mode";modeError="You were removed from the room.";render()});
 socket.on("voice:peers",async({peerIds})=>{if(!voice.local)return;for(const id of (Array.isArray(peerIds)?peerIds:[])){if(id&&id!==socket.id)await createOffer(id)}});socket.on("voice:peer-left",({peerId})=>dropPeer(peerId));socket.on("voice:signal",handleSignal);socket.on("disconnect",()=>{if(room)showToast("Connection lost — reconnecting…")});socket.on("connect",()=>{if(room)showToast("Connected")});
}
async function createRoom(){modeError="";const rn=document.getElementById("roomNameInput")?.value.trim();const pw=document.getElementById("roomPassInput")?.value;if(!rn)return modeError="Room name is required.";await connect();if(!socket.connected)return modeError="SyncBeat server is not reachable right now.";socket.emit("room:create",{name:rn,userName:name,password:pw||undefined},r=>{if(r?.error){modeError=r.error;render()}else{room=r.state;roomPassword="";chat=[];history.replaceState({},"",location.pathname+"?room="+room.code);render()}})}
async function joinRoom(){modeError="";const c=(document.getElementById("joinCodeInput")?.value||joinCode).trim().toUpperCase();const pw=document.getElementById("joinPassInput")?.value||"";if(!/^[A-Z0-9]{6}$/.test(c)){modeError="Enter a valid 6-character room code.";render();return}await connect();if(!socket.connected){modeError="SyncBeat server is not reachable right now.";render();return}socket.emit("room:join",{code:c,userName:name,password:pw||undefined},r=>{if(r?.error){modeError=r.error;render()}else{joinCode=c;room=r.state;chat=r.chat||[];history.replaceState({},"",location.pathname+"?room="+c);render()}})}
function leaveRoom(){leaveVoice();if(socket?.connected)socket.disconnect();room=null;chat=[];homeView="mode";history.replaceState({},"",location.pathname);render();}
async function copyInvite(){const u=location.href;try{await navigator.clipboard.writeText(u);showToast("Invite link copied")}catch{showToast(u)}}
function extractYouTubeId(input){try{const s=input.trim();if(/^[A-Za-z0-9_-]{11}$/.test(s))return s;const u=new URL(s);const h=u.hostname.replace(/^www\./,"");if(h==="youtu.be")return u.pathname.split("/").filter(Boolean)[0]||null;if(["youtube.com","m.youtube.com","music.youtube.com"].includes(h)){if(u.pathname==="/watch")return u.searchParams.get("v");const p=u.pathname.split("/").filter(Boolean);if(["shorts","embed","live"].includes(p[0]))return p[1]||null}return null}catch{return null}}
function ytThumb(id){return `https://i.ytimg.com/vi/${id}/hqdefault.jpg`}
function startFirstQueued(autoPlay=false){if(!room||room.current||!room.queue?.length||!canControl())return;playQueueItem(0,Boolean(autoPlay))}
function playQueueItem(index,autoPlay=true){if(!room||!canControl())return;const s=room.queue?.[index];if(!s)return;const optimisticNow=Date.now()+serverClockOffset;room.current={...s};room.queue=room.queue.filter((_,i)=>i!==index);room.position=0;room.isPlaying=Boolean(autoPlay);room.updatedAt=optimisticNow;currentVideoId=null;refreshRoomState();socket.emit("player:action",{type:"load",song:s,index,removeFromQueue:true,autoplay:Boolean(autoPlay)})}
function addQueue(){const i=document.getElementById("queueInput");const id=extractYouTubeId(i?.value||"");if(!id){showToast("Paste a valid YouTube URL or video ID");return}const song={id,title:"YouTube video "+id,thumbnail:ytThumb(id),addedBy:name};if(!room?.current&&canControl()){room.current=song;room.position=0;room.isPlaying=false;room.updatedAt=Date.now()+serverClockOffset;currentVideoId=null;refreshRoomState()}socket.emit("queue:add",song);i.value="";showToast(room?.current?.id===id?"Added as the first track":"Added to shared queue")}
function bindKeyboard(){window.addEventListener("keydown",e=>{if(e.target instanceof HTMLInputElement||e.target instanceof HTMLTextAreaElement)return;if(!room)return;if(e.code==="Space"&&canControl()){e.preventDefault();socket.emit("player:action",{type:room.isPlaying?"pause":"play",position:getPlayerTime()})}if(e.key.toLowerCase()==="c")document.getElementById("chatInput")?.focus();if(e.key.toLowerCase()==="m"&&voice.joined)toggleVoiceMute();if(e.key.toLowerCase()==="v"&&voice.ptt&&voice.joined){e.preventDefault();voice.speaking=true;updateLocalTrack()}});window.addEventListener("keyup",e=>{if(e.key.toLowerCase()==="v"&&voice.ptt){voice.speaking=false;updateLocalTrack()}})}
bindKeyboard();

function getSyncedRoomPosition(){
 if(!room)return 0;
 if(!room.isPlaying)return Math.max(0,room.position||0);
 const serverNow=Date.now()+serverClockOffset;
 const elapsed=Math.max(0,(serverNow-(Number(room.updatedAt)||serverNow))/1000);
 return Math.max(0,(room.position||0)+elapsed);
}
function initRoomPlayer(){
 if(!ytReady||!room?.current)return;
 const id=room.current.id;
 const target=getSyncedRoomPosition();
 autoplayBlocked=false;
 // Reuse the same official YouTube player when changing tracks. This is faster and avoids
 // the visible blank/loading flash caused by destroying and rebuilding the iframe.
 if(player&&playerReady){
  currentVideoId=id;
  playerError="";
  try{
   suppressPlayerEvents=true;
   if(room.isPlaying){
    player.loadVideoById({videoId:id,startSeconds:target});
   }else{
    player.cueVideoById({videoId:id,startSeconds:target});
   }
   window.setTimeout(()=>{suppressPlayerEvents=false;syncRoomToPlayer()},450);
  }catch{
   suppressPlayerEvents=false;
   // Fall back to a clean player instance if a browser/player state rejects the load call.
   playerReady=false;
  }
  if(playerReady){
   hidePlayerFallback();
   refreshPlayerControls();
   return;
  }
 }
 currentVideoId=id;
 playerReady=false;
 playerError="";
 playerLoadToken++;
 const token=playerLoadToken;
 const mount=document.getElementById("playerMount");
 if(!mount)return;
 mount.innerHTML="";
 player?.destroy?.();
 player=null;
 player=new YT.Player(mount,{videoId:id,playerVars:{playsinline:1,controls:0,rel:0,modestbranding:1,disablekb:1,iv_load_policy:3},events:{
  onReady:e=>{
   if(token!==playerLoadToken)return;
   playerReady=true;
   try{
    const data=e.target.getVideoData?.();
    if(data?.title&&room?.current){room.current.title=data.title;if(roomHeading())roomHeading().textContent=data.title}
   }catch{}
   e.target.setVolume(Number(localStorage.getItem("syncbeat:vol")||70));
   const synced=getSyncedRoomPosition();
   try{e.target.seekTo(synced,true)}catch{}
   hidePlayerFallback();
   startPlayerTicker();
   refreshPlayerControls();
   if(room.isPlaying){
    try{e.target.playVideo()}catch{}
   }
  },
  onStateChange:e=>{
   if(!room)return;
   if(e.data===0&&canControl())socket.emit("player:action",{type:"ended"});
   refreshPlayerControls();
  },
  onError:e=>{playerError=ytError(e.data);showPlayerFallback(playerError)},
  onAutoplayBlocked:()=>{
   autoplayBlocked=true;
   showAutoplayPrompt();
  }
 }});
}
function initSoloPlayer(id){currentVideoId=id;playerReady=false;playerError="";const mount=document.getElementById("soloMount");if(!mount)return;mount.innerHTML="";player?.destroy?.();player=new YT.Player(mount,{videoId:id,playerVars:{playsinline:1,controls:0,rel:0,modestbranding:1,disablekb:1},events:{onReady:e=>{playerReady=true;e.target.setVolume(Number(document.getElementById("soloVol")?.value||70));hideSoloFallback();startPlayerTicker();initPlayerStateUI("solo")},onStateChange:e=>{if(document.getElementById("soloStatus"))document.getElementById("soloStatus").textContent=e.data===1?"Playing":e.data===2?"Paused":"Ready"},onError:e=>{showSoloError(ytError(e.data))},onAutoplayBlocked:()=>showToast("Click Play to start")}})}
function ytError(code){return ({2:"The YouTube video ID is invalid.",5:"YouTube couldn't play this video in the HTML5 player.",100:"This video is unavailable or private.",101:"This video owner's settings don't allow embedded playback.",150:"This video owner's settings don't allow embedded playback.",153:"YouTube did not authorize this embed. Try another video."})[Number(code)]||"YouTube could not play this video here. Try another video."}
function roomHeading(){return document.getElementById("roomHeading")}
function showAutoplayPrompt(){
 const f=document.getElementById("playerFallback");
 if(!f)return;
 f.innerHTML=`<div><div class="vIcon">${icon("play-circle",25)}</div><h3>Ready to sync</h3><p>Your browser blocked automatic playback. Tap once and SyncBeat will start this room at the current position.</p><button id="enableSyncPlay" class="btn btnPrimary" style="margin-top:13px">${icon("play",14)} Enable synced playback</button></div>`;
 f.style.display="grid";
 icons();
 document.getElementById("enableSyncPlay")?.addEventListener("click",()=>{try{const target=getSyncedRoomPosition();player?.seekTo?.(target,true);if(room?.isPlaying)player?.playVideo?.();autoplayBlocked=false;hidePlayerFallback()}catch{} });
}
function showPlayerFallback(text){const f=document.getElementById("playerFallback");if(!f)return;f.innerHTML=`<div><div class="vIcon">${icon("circle-alert",24)}</div><h3>Video unavailable</h3><p>${esc(text)} The owner may have disabled embedding, or the video may be private/restricted.</p></div>`;f.style.display="grid";icons()}
function hidePlayerFallback(){const f=document.getElementById("playerFallback");if(f)f.style.display="none"}
function showSoloError(text){const f=document.getElementById("soloFallback");if(!f)return;f.innerHTML=`<div><div class="vIcon">${icon("circle-alert",24)}</div><h3>Video unavailable</h3><p>${esc(text)}</p></div>`;f.style.display="grid";icons()}
function hideSoloFallback(){const f=document.getElementById("soloFallback");if(f)f.style.display="none"}
function getPlayerTime(){try{return player?.getCurrentTime?.()||room?.position||0}catch{return room?.position||0}}
function startPlayerTicker(){clearInterval(playbackTimer);playbackTimer=setInterval(()=>{if(!player?.getCurrentTime)return;const t=player.getCurrentTime();const d=player.getDuration?.()||0;lastServerPosition=t;const pos=document.getElementById("timePos")||document.getElementById("soloPos");const dur=document.getElementById("timeDur")||document.getElementById("soloDur");const range=document.getElementById("playerRange")||document.getElementById("soloRange");if(pos)pos.textContent=fmt(t);if(dur)dur.textContent=fmt(d);if(range){range.max=Math.max(1,Math.floor(d));if(document.activeElement!==range)range.value=Math.min(t,d)}},500)}
function initPlayerStateUI(type){startPlayerTicker();const play=document.getElementById(type==="solo"?"soloPlay":"playPause");if(play)play.innerHTML=icon((type==="solo"&&player?.getPlayerState?.()===1)||(type!=="solo"&&room?.isPlaying)?"pause":"play",18);icons()}
function refreshPlayerControls(){const b=document.getElementById("playPause");if(b){b.innerHTML=icon(room.current&&room.isPlaying?"pause":"play",18);b.disabled=!canControl()||!room.current;icons()}if(roomHeading())roomHeading().textContent=room.current?.title||"Nothing is playing yet";const r=document.getElementById("playerRange");if(r){r.max=Math.max(1,Math.floor(player?.getDuration?.()||0));r.value=Math.min(getSyncedRoomPosition(),r.max);r.disabled=!canControl()||!room.current}const back=document.getElementById("back10"),fwd=document.getElementById("fwd10"),next=document.getElementById("nextTrack");if(back)back.disabled=!canControl()||!room.current;if(fwd)fwd.disabled=!canControl()||!room.current;if(next)next.disabled=!canControl()||!room.queue?.length;const p=document.querySelector(".syncBadge");if(p)p.innerHTML=`<span class="syncDot"></span>${room.current?(room.isPlaying?"Playing in sync":"Paused for everyone"):"Waiting for a track"}`}
function roomSeek(delta){if(!canControl())return;const v=Math.max(0,getPlayerTime()+delta);player?.seekTo?.(v,true);socket.emit("player:action",{type:"seek",position:v})}
function roomSeekTo(v){if(!canControl())return;player?.seekTo?.(v,true);socket.emit("player:action",{type:"seek",position:v})}
function soloSeek(delta){if(!player)return;player.seekTo(Math.max(0,(player.getCurrentTime?.()||0)+delta),true)}
function loadSolo(){const v=document.getElementById("soloUrl")?.value||"";const id=extractYouTubeId(v);if(!id){showToast("Paste a valid YouTube URL or 11-character ID");return}hideSoloFallback();initSoloPlayer(id)}

function refreshRoomState(){if(!room)return;if(!room.current&&room.queue?.length&&canControl())startFirstQueued(false);const me=getMe();const q=document.getElementById("queueList");if(q){q.innerHTML=queueHtml();bindQueueEvents()}const people=document.getElementById("peopleList");if(people){people.innerHTML=peopleHtml();bindPeopleEvents()}if(tab==="people"){const c=document.getElementById("chatContent");if(c)c.innerHTML=peoplePanelHtml();icons()}else refreshChat();const h=roomHeading();if(h)h.textContent=room.current?.title||"Nothing is playing yet";if(room.current?.id!==currentVideoId||!room.current)initRoomPlayer();else syncRoomToPlayer();refreshPlayerControls();renderRoomVoice();icons()}
function refreshChat(){const c=document.getElementById("chatContent");if(!c)return;if(!document.getElementById("messages")){if(tab==="chat"){c.innerHTML=chatHtml();bindChatOnly();icons()}return}const m=document.getElementById("messages");m.innerHTML=(chat.length?chat.map(messageHtml).join(""):emptyChatHtml())+`<div id="typingLine"></div>`;document.querySelectorAll("[data-open-react]").forEach(b=>b.addEventListener("click",()=>openReactionPicker(b.dataset.openReact)));document.querySelectorAll("[data-react-id]").forEach(b=>b.addEventListener("click",()=>socket.emit("chat:react",{id:b.dataset.reactId,emoji:b.dataset.reactKey})));const messages=document.getElementById("messages");messages.scrollTop=messages.scrollHeight;icons()}
function syncRoomToPlayer(){if(!playerReady||!player||!room||!room.current)return;const target=getSyncedRoomPosition();const local=getPlayerTime();if(Math.abs(local-target)>1.25){suppressPlayerEvents=true;try{player.seekTo(target,true)}catch{}setTimeout(()=>suppressPlayerEvents=false,260)}const state=player.getPlayerState?.();if(room.isPlaying&&state!==1){suppressPlayerEvents=true;try{player.playVideo?.()}catch{}setTimeout(()=>suppressPlayerEvents=false,260)}else if(!room.isPlaying&&state===1){suppressPlayerEvents=true;try{player.pauseVideo?.()}catch{}setTimeout(()=>suppressPlayerEvents=false,260)}}
function renderRoomVoice(){const s=document.getElementById("voiceStatus");if(s){s.textContent=voice.joined?"ON":"OFF";s.className="pill "+(voice.joined?"pillGreen":"")};const j=document.getElementById("voiceJoin");if(j)j.textContent=voice.joined?"Leave voice":"Join voice";const m=document.getElementById("voiceMute");if(m){m.innerHTML=icon(voice.muted?"mic-off":"mic",15);m.disabled=!voice.joined}const d=document.getElementById("voiceDeaf");if(d)d.disabled=!voice.joined;const p=document.getElementById("voicePtt");if(p){p.textContent=voice.ptt?"Push-to-talk: V":"Normal microphone";p.classList.toggle("active",voice.ptt);p.disabled=!voice.joined}const err=document.getElementById("voiceError");if(err&&!voice.error)err.innerHTML="";const vp=document.getElementById("voicePeople");if(vp)vp.innerHTML=voicePeopleHtml();icons()}
async function joinVoice(){voice.error="";if(!navigator.mediaDevices?.getUserMedia){voice.error="This browser doesn't support microphone access.";renderRoomVoice();return}try{voice.local=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true,autoGainControl:true}});voice.joined=true;updateLocalTrack();socket.emit("voice:join");renderRoomVoice()}catch(e){voice.error=e?.name==="NotAllowedError"?"Microphone permission was denied. Allow mic access and try again.":"Could not access your microphone. Check browser permissions.";renderRoomVoice();}}
function leaveVoice(){try{voice.local?.getTracks().forEach(t=>t.stop())}catch{}voice.local=null;voice.peers.forEach(pc=>pc.close());voice.peers.clear();voice.audios.forEach(a=>a.remove());voice.audios.clear();voice.peerIds.clear();voice.joined=false;voice.error="";if(socket?.connected)socket.emit("voice:leave");renderRoomVoice()}
function toggleVoiceMute(){voice.muted=!voice.muted;updateLocalTrack();if(socket?.connected)socket.emit("voice:mute",voice.muted);renderRoomVoice()}
function updateLocalTrack(){if(!voice.local)return;const enabled=!voice.muted&&(!voice.ptt||voice.speaking);voice.local.getAudioTracks().forEach(t=>t.enabled=enabled)}
function makePeer(id){if(voice.peers.has(id))return voice.peers.get(id);const cfg={iceServers:[{urls:"stun:stun.l.google.com:19302"},{urls:"stun:stun1.l.google.com:19302"}]};const pc=new RTCPeerConnection(cfg);voice.local?.getTracks().forEach(t=>pc.addTrack(t,voice.local));pc.onicecandidate=e=>{if(e.candidate)socket.emit("voice:signal",{peerId:id,data:{candidate:e.candidate}})};pc.onconnectionstatechange=()=>{if(["failed","closed","disconnected"].includes(pc.connectionState))dropPeer(id)};pc.ontrack=e=>{let a=voice.audios.get(id);if(!a){a=new Audio();a.autoplay=true;a.playsInline=true;voice.audios.set(id,a)}a.srcObject=e.streams[0];a.volume=(voice.volumes[id]??100)/100;a.muted=voice.deaf;a.play().catch(()=>{});voice.peerIds.add(id);renderRoomVoice()};voice.peers.set(id,pc);return pc}
async function createOffer(id){try{const pc=makePeer(id);if(pc.signalingState!=="stable")return;const offer=await pc.createOffer({offerToReceiveAudio:true});await pc.setLocalDescription(offer);socket.emit("voice:signal",{peerId:id,data:pc.localDescription})}catch{}}
async function handleSignal({peerId,data}){if(!voice.local||!peerId)return;const pc=makePeer(peerId);try{if(data?.candidate){if(pc.remoteDescription){await pc.addIceCandidate(data.candidate)}else{const list=voice.pendingCandidates.get(peerId)||[];list.push(data.candidate);voice.pendingCandidates.set(peerId,list)}return}if(data?.type==="offer"){if(pc.signalingState!=="stable")return;await pc.setRemoteDescription(data);const pending=voice.pendingCandidates.get(peerId)||[];for(const c of pending){try{await pc.addIceCandidate(c)}catch{}}voice.pendingCandidates.delete(peerId);const a=await pc.createAnswer();await pc.setLocalDescription(a);socket.emit("voice:signal",{peerId,data:pc.localDescription})}else if(data?.type==="answer"){if(pc.signalingState==="have-local-offer"){await pc.setRemoteDescription(data);const pending=voice.pendingCandidates.get(peerId)||[];for(const c of pending){try{await pc.addIceCandidate(c)}catch{}}voice.pendingCandidates.delete(peerId)}}}catch{}}
function dropPeer(id){voice.peers.get(id)?.close();voice.peers.delete(id);voice.audios.get(id)?.remove();voice.audios.delete(id);voice.peerIds.delete(id);renderRoomVoice()}

function themeInit(){document.documentElement.dataset.theme=theme==="light"?"light":"dark"}

themeInit();
if(window.YT?.Player)ytReady=true;window.onYouTubeIframeAPIReady=()=>{ytReady=true;if(room?.current)initRoomPlayer()};
render();
})();
</script>
